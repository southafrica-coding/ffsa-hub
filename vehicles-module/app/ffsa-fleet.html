  'ext-towbar': {w:"A tow bar pulls a trailer. If it’s loose, the trailer can break free. If the trailer socket doesn’t work, the trailer’s lights don’t work and nobody behind can see it braking or turning.", h:["Shake the tow ball firmly. It must not move.", "Check the bolts and the safety chain point aren’t damaged or rusted through.", "When a trailer is hooked up, check its brake lights and indicators work."], ok:"Solid, socket works.", mon:"Rusty but solid.", fix:"Loose tow ball, or the socket doesn’t work. Mark N/A if there’s no tow bar."},

  'gls-wind': {w:"The driver has to see clearly. A small chip can turn into a long crack when the vehicle hits a bump or the sun heats the glass. A crack in front of the driver fails a roadworthy test, and a cracked windscreen is weaker in a crash.", h:["Stand in front and look at the windscreen at an angle; chips show up better that way.", "Then sit in the driver’s seat and look out.", "Note where any chips or cracks are. The area the driver’s wiper cleans matters most."], ok:"No chips or cracks.", mon:"A small chip outside the driver’s view: get it repaired soon, it’s cheap.", fix:"Any crack, or a chip in the driver’s view."},
  'gls-side': {w:"Side and rear windows let the driver see around the vehicle and keep passengers safe and dry.", h:["Look at each window for cracks and chips.", "Check window tint isn’t peeling so badly that it blocks the view."], ok:"All clear and intact.", mon:"Small chip or peeling tint.", fix:"A cracked or broken window."},
  'gls-winders': {w:"Windows must open in an emergency, and close to keep rain and thieves out. A window stuck open is a security risk when the vehicle is parked overnight.", h:["Open and close each window with its switch.", "It should move smoothly and close all the way."], ok:"All work.", mon:"Slow or noisy.", fix:"A window won’t close."},
  'gls-mirrors': {w:"Mirrors show the driver what’s beside and behind the vehicle, especially when changing lanes. Vans are big with large blind spots, so good mirrors prevent side-swipes.", h:["Check both side mirrors are firmly attached and the glass isn’t cracked.", "Sit in the driver’s seat and adjust them. You should just see the side of the vehicle and the lane next to you."], ok:"Secure and adjustable.", mon:"Glass slightly cracked, or adjuster stiff.", fix:"Mirror missing, loose, or glass broken."},
  'gls-rvm': {w:"The inside mirror shows what’s behind the vehicle. It must be secure and adjustable, even if luggage sometimes blocks the view.", h:["Check it’s firmly attached and the glass is clear.", "Adjust it to see out of the back window."], ok:"Secure and clear.", mon:"Loose or wobbly.", fix:"Missing or broken."},
  'gls-blades': {w:"Wiper blades clear rain from the windscreen. The sun makes the rubber hard and cracked, so it leaves streaks, which makes it hard to see in a storm, especially at night.", h:["Lift each wiper arm and run a finger along the rubber. It should be soft and smooth, not cracked or torn.", "Spray washer fluid and switch on the wipers. They should clean the glass in one sweep without streaks or juddering."], ok:"Clean sweep, no streaks.", mon:"Some streaking: replace soon.", fix:"Rubber torn or hanging off."},
  'gls-wipers': {w:"In heavy rain the wipers must be fast enough to keep the windscreen clear.", h:["Wet the windscreen with washer fluid.", "Try every wiper speed, including the slow on-and-off setting.", "They should move smoothly and stop at the bottom of the windscreen."], ok:"All speeds work.", mon:"One speed doesn’t work.", fix:"Wipers don’t work."},
  'gls-washer': {w:"Washer spray clears dust, mud and squashed insects. On a dusty road with the sun low, a dirty windscreen can blind the driver.", h:["Pull the washer lever.", "Spray from each jet should land on the middle of the windscreen."], ok:"Strong spray from all jets.", mon:"Weak spray, or a jet aims too high or low.", fix:"Nothing comes out."},

  'pre-lights': {w:"Lights let the driver see at night and let others see the vehicle and know when it’s braking or turning. This quick check prevents many accidents.", h:["Switch on the headlights and walk round to see they work.", "Switch on the hazard lights: every indicator should flash.", "Ask someone to watch while you press the brake pedal, or reverse close to a wall and look in the mirror for the red glow."], ok:"All work.", mon:"A small light out, like the number plate light.", fix:"A headlight, brake light or indicator doesn’t work."},
  'lgt-dip': {w:"Dipped headlights are the normal night-driving lights. They light the road without blinding other drivers. With one out, the vehicle can look like a motorbike to oncoming drivers.", h:["Switch on the headlights (dipped).", "Stand in front: both must work and be equally bright.", "Against a wall, check they point down, not up into other drivers’ eyes."], ok:"Both work and aim correctly.", mon:"One is dimmer than the other.", fix:"One or both don’t work."},
  'lgt-bright': {w:"Bright lights light the road far ahead on dark country roads, so the driver sees animals and people sooner.", h:["Switch to bright (push or pull the indicator stalk).", "Both headlights should get brighter and the blue light on the dashboard should come on."], ok:"Both work.", mon:"", fix:"Brights don’t work."},
  'lgt-park': {w:"Park lights and daytime running lights make the vehicle easier to see, for example when it’s parked on the side of the road at dusk.", h:["Switch to the park-light position and walk around. The small front and rear lights should be on."], ok:"All on.", mon:"One small bulb out.", fix:"None work."},
  'lgt-ind': {w:"Indicators tell other drivers that you’re turning or changing lanes. Without them, other drivers can’t guess what you’ll do.", h:["Switch on the left indicator and walk around: the front, side and rear lights on that side should flash.", "Repeat on the right.", "If an indicator flashes very fast, a bulb is usually blown."], ok:"All flash normally.", mon:"A side repeater is out.", fix:"A front or rear indicator doesn’t work."},
  'lgt-hazard': {w:"Hazard lights warn others when the vehicle is stopped in a dangerous place, like after a breakdown.", h:["Press the hazard button (the red triangle).", "All the indicators should flash together."], ok:"All flash.", mon:"", fix:"Don’t work."},
  'lgt-brake': {w:"Brake lights tell the driver behind that you’re slowing down. If they don’t work, you can be hit from behind.", h:["Ask someone to stand behind while you press the brake pedal.", "Both brake lights and the high third light must come on.", "Alone? At dusk, reverse close to a wall or window and look in the mirror for the red glow when you press the brake."], ok:"All three work.", mon:"Only the high third light is out.", fix:"A main brake light doesn’t work."},
  'lgt-tail': {w:"Tail lights show the back of the vehicle at night so others don’t drive into it.", h:["Switch on the lights and check both rear lights glow red."], ok:"Both work.", mon:"", fix:"One or both don’t work."},
  'lgt-reverse': {w:"Reverse lights warn people behind that the vehicle is about to reverse, and help the driver see behind at night.", s:"Keep your foot on the brake while you do this.", h:["Start the engine. With your foot on the brake (and the handbrake on), select reverse.", "Check the white lights at the back come on (ask a helper, or look in a window reflection)."], ok:"Both work.", mon:"One is out.", fix:"Neither works."},
  'lgt-plate': {w:"The back number plate must be readable at night. A missing plate light can get a fine.", h:["Switch on the lights and check the small light above the back plate works."], ok:"Works.", mon:"Out: replace the bulb.", fix:""},
  'lgt-fog': {w:"Fog lights help others see the vehicle, and help the driver see the road edge, in thick mist.", h:["Switch on the fog lights and check the front ones (and the rear one, if there is one)."], ok:"Work.", mon:"One is out.", fix:"Mark N/A if there are no fog lights."},
  'lgt-lens': {w:"Cracked or yellowed headlight covers make the light weak and scattered, so the driver sees less at night. Water getting in through cracks also blows bulbs.", h:["Look at each headlight and tail light cover for cracks, holes or water inside.", "Look for a cloudy yellow colour on the headlights."], ok:"Clear and intact.", mon:"Cloudy: can be polished.", fix:"Cracked, or water inside."},
  'lgt-cabin': {w:"Inside lights help passengers get in and out safely at night and help find things that have been dropped.", h:["Open each door: the inside light should come on.", "Check the switches on the roof lights work."], ok:"Work.", mon:"One is out.", fix:""},
  'lgt-reflect': {w:"Reflectors bounce other cars’ headlights back, so the vehicle can be seen even when its own lights are off, for example when it’s broken down at night.", h:["Find the red reflectors at the back (often built into the bumper or lights).", "Check they’re clean and not broken."], ok:"Clean and intact.", mon:"Dirty or slightly cracked.", fix:"Missing or broken."},

  'pre-tyres': {w:"A soft or damaged tyre can burst at speed, which can make a vehicle roll, especially a loaded van. A 30-second look before leaving catches most problems.", h:["Walk around and look at each tyre. Does one look flatter than the others?", "Look for cuts, bulges or nails.", "If one looks soft, check its pressure before you leave."], ok:"All look normal.", mon:"One looks a bit soft: check and pump it up.", fix:"A flat tyre, a bulge, or a deep cut."},
  'tyr-fl': TREAD_HELP, 'tyr-fr': TREAD_HELP, 'tyr-rl': TREAD_HELP, 'tyr-rr': TREAD_HELP,
  'tyr-spare': {w:"A spare wheel is useless if it’s flat, worn out or missing when you get a puncture far from town.", h:["Find the spare. On vans it usually hangs in a cradle under the vehicle; in cars it’s under the boot floor.", "Check it’s there and has tread.", "Check its pressure. Spares lose air slowly while they wait."], ok:"There, good tread, pumped up.", mon:"Low pressure: pump it up.", fix:"Missing, flat, or worn out."},
  'tyr-press': {w:"The right air pressure lets tyres grip properly, wear evenly and use less fuel. A tyre with too little air gets hot and can burst, especially with a full van on the highway.", h:["Check when the tyres are cold: before driving, or after the vehicle has stood for an hour.", "Find the right pressures on the sticker on the driver’s door frame or inside the fuel flap. There are often two numbers: use the higher “full load” one when the van will be full.", "Check each tyre with a pressure gauge (or the machine at a petrol station) and add air where needed.", "Put the valve caps back on."], ok:"All at the sticker pressure.", mon:"One was low but held after pumping it up.", fix:"A tyre keeps losing air (a slow puncture)."},
  'tyr-side': {w:"The sidewall is the side of the tyre. A bulge means the inside of the tyre is broken and it can burst at any moment. Cuts usually come from kerbs and potholes.", h:["Look at the outside wall of every tyre.", "Turn the steering wheel all the way to see the inside wall of the front tyres.", "Look for bulges, cuts, cracks, or anything stuck in the tyre."], ok:"Smooth and undamaged.", mon:"Small surface scuffs.", fix:"Any bulge, a deep cut, or cords showing."},
  'tyr-wear': {w:"The way a tyre wears tells a story. Wear on one edge usually means the wheels are out of alignment. Wear on both edges means too little air. Wear in the middle means too much air. Fixing the cause early saves buying new tyres.", h:["Look across each tyre and compare the inner edge, the middle and the outer edge.", "If it looks uneven, measure the tread on each edge with the gauge."], ok:"Even across the tyre.", mon:"Uneven: book a wheel alignment.", fix:"One edge worn down to the wire."},
  'tyr-nuts': {w:"Wheel nuts hold the wheels on. A missing or loose nut puts more strain on the others, and in the worst case the wheel comes off. The locknut key is needed to undo the special locking nut.", h:["Count the nuts on each wheel. None should be missing.", "Look for rust streaks coming from a nut, which can mean it’s loose.", "Check the locknut key is in the vehicle."], ok:"All there, key in the vehicle.", mon:"A rust streak: ask the workshop to check the torque.", fix:"A missing nut, or no locknut key."},
  'tyr-rims': {w:"A bent or cracked rim can let air leak out slowly, or break when the vehicle hits a pothole.", h:["Look at each rim for cracks, missing chunks or bent edges.", "A shaking steering wheel after hitting a pothole can mean a bent rim."], ok:"No damage.", mon:"Kerb scuffs only.", fix:"Cracked or bent."},
  'tyr-age': {w:"Rubber gets old and hard, even when the tread still looks fine, especially in the South African sun. Old tyres can crack and come apart. Many tyre makers advise replacing tyres after about 6 years.", h:["Find the code on the side of the tyre that starts with DOT.", "The last 4 numbers show when it was made: the week, then the year. 2321 means week 23 of 2021.", "Work out how old each tyre is."], ok:"Under 5 years old.", mon:"5 to 6 years old: plan to replace.", fix:"Over 6 years old, or cracking."},

  'eng-oil': {s:"Engine off, on level ground, for at least 5 minutes. Parts of the engine can be very hot.", w:"Oil stops the engine’s metal parts grinding against each other. Without enough oil, the engine can be destroyed in minutes, which costs tens of thousands of rands. Milky, creamy oil can mean coolant is leaking into the engine, a sign of a head gasket problem.", h:["Open the bonnet and pull out the dipstick (usually a yellow or orange loop).", "Wipe it clean with a cloth, push it all the way back in, then pull it out again.", "The oil mark should be between the two marks (MIN and MAX, or two dots).", "Look at the colour: golden-brown is good, black means a service is due, milky means stop and call the workshop."], ok:"Between the marks, clean colour.", mon:"Close to MIN (top up with the right oil), or very black.", fix:"Below MIN, milky, or the oil warning light came on."},
  'eng-cool': {s:"Only check with the engine cold. Never open the radiator cap on a hot engine: boiling water can spray out and burn you.", w:"Coolant carries heat away from the engine. If it runs low, the engine overheats, which can ruin the head gasket (the problem KVS has now).", h:["Find the see-through plastic coolant tank with MIN and MAX marks.", "Look at the level from the side, without opening it.", "If it’s low, top it up with the correct coolant mix (not plain tap water) and tell the workshop if it keeps dropping."], ok:"Between the marks.", mon:"Close to MIN.", fix:"Below MIN or empty, keeps dropping, or the engine overheated."},
  'eng-brake': {s:"Don’t open the brake fluid cap. Brake fluid damages paint and skin.", w:"Brake fluid carries the push from your foot on the pedal to the brakes at the wheels. A low level can mean the brake pads are worn or there’s a leak, and the brakes could fail.", h:["Find the small tank at the back of the engine bay on the driver’s side, usually with a yellow cap.", "Check the level is between MIN and MAX by looking from the side.", "Look at the colour: clear gold is good, dark brown means it’s old."], ok:"Between the marks, clear.", mon:"Dark, or close to MIN.", fix:"Below MIN: don’t drive, call the workshop."},
  'eng-ps': {w:"Power steering fluid makes the steering light and easy to turn. If it runs low, the steering gets heavy and the pump gets damaged. Many newer vehicles have electric steering with no fluid at all: then mark N/A.", h:["Find the power steering tank (its cap often shows a steering wheel).", "Check the level against the marks."], ok:"Between the marks.", mon:"Close to the low mark.", fix:"Very low, or the steering is heavy or whining."},
  'eng-washer': {w:"Without washer fluid you can’t clean a dirty windscreen while driving.", h:["Find the tank with the windscreen symbol on the cap.", "Fill it with water and a little windscreen washer liquid. Don’t use dishwashing liquid: it leaves a film."], ok:"Full.", mon:"Low: fill it now.", fix:""},
  'eng-batt': {s:"Never touch both battery terminals with anything metal at the same time: it can spark and burn.", w:"The battery starts the vehicle. Loose or crusty connections are one of the most common reasons a vehicle won’t start.", h:["Find the battery and look at the two terminals: + (red) and – (black).", "Look for white, green or blue powdery crust.", "With gloves on, wiggle each cable. It must not move."], ok:"Clean and tight.", mon:"Some crust: clean it off.", fix:"A loose cable, or a cracked or swollen battery."},
  'eng-belt': {s:"Engine off and keys out of the ignition. Keep your hands away from the fan.", w:"The drive belt turns the parts that charge the battery, run the aircon and often pump the coolant. If it snaps, the battery goes flat and the engine can overheat.", h:["Find the long rubber belt at the front of the engine.", "Look for cracks, frayed edges or shiny, glazed rubber.", "When you start the engine, listen: a loud squeal can mean the belt is slipping."], ok:"No cracks, no squeal.", mon:"Small cracks, or a squeal on cold mornings.", fix:"Frayed, deep cracks or missing pieces."},
  'eng-hoses': {s:"Only touch the hoses with the engine cold.", w:"Rubber hoses carry hot coolant between the engine and the radiator. An old hose can burst and the engine overheats within minutes.", h:["Look at the big rubber hoses going to the radiator.", "Squeeze them (engine cold). They should feel firm, not soft, sticky or rock hard.", "Look for cracks, bulges, wet spots, or white or green crust at the ends."], ok:"Firm and dry.", mon:"Slightly soft or crusty at the clips.", fix:"Cracked, bulging or leaking."},
  'eng-leaks': {w:"A leak is often the first sign that something is wearing out. Catching it early prevents a breakdown. The colour of the drip tells you what it is.", h:["Look at the ground where the vehicle stood overnight.", "Black or brown drips: oil. Green, pink or orange: coolant. Red: gearbox or steering fluid. Clear water under the front is normal: it comes from the aircon.", "Look in the engine bay for wet, oily patches."], ok:"Dry ground (or only aircon water).", mon:"A few drops: keep watching.", fix:"A puddle, or any coolant or brake fluid leak."},
  'eng-wires': {w:"Mice and rats like to nest in the engine bays of parked vehicles and chew the wiring. That can cause electrical faults or even a fire.", h:["Look in the engine bay for nests, droppings, food or chewed plastic.", "Look for wires with bare copper showing or hanging loose."], ok:"Clean, wires intact.", mon:"Signs of rodents, but no damage yet.", fix:"Chewed or bare wires."},
  'eng-atf': {w:"An automatic gearbox needs clean fluid to change gears smoothly. Old or low fluid can ruin the gearbox, one of the most expensive repairs.", h:WS, ok:"Level and condition OK.", mon:"Due for a change soon.", fix:"Low, burnt or leaking."},
  'eng-batttest': {w:"A battery can look fine but be weak inside. A battery tester shows how much strength is left, so it can be replaced before it leaves someone stranded.", h:WS, ok:"Battery good.", mon:"Weak: replace soon.", fix:"Failed the test."},
  'eng-air': {w:"The air filter cleans the air going into the engine. On dusty roads it clogs up, the engine loses power and uses more fuel.", h:WS, ok:"Clean.", mon:"Dirty: replace at the next service.", fix:"Blocked or damaged."},
  'eng-mounts': {w:"Rubber mounts hold the engine and gearbox in place and soak up vibration. Broken mounts cause clunks and shaking, and strain other parts.", h:WS, ok:"Mounts good.", mon:"Starting to crack.", fix:"Broken."},
  'eng-timing': {w:"The timing belt or chain keeps the engine’s moving parts in step. If a belt snaps, the engine can be destroyed. It must be replaced at a set km, which is in the service book.", h:WS.concat(["Check the km of the last replacement in the service book and when the next one is due."]), ok:"Replaced on time.", mon:"Due within the next 10 000 km.", fix:"Overdue, or no record of a replacement."},

  'cab-belts': {w:"Seat belts are the most important safety equipment in the vehicle. In a crash, a belt that doesn’t lock or is frayed can fail. Every seat that a passenger sits in needs a belt that works.", h:["For every seat, pull the belt out quickly. It should lock with a jerk.", "Let it go. It should roll back in by itself.", "Click it into the buckle and pull hard: it must hold. Press the button: it must release.", "Look along the whole belt for cuts and fraying."], ok:"Every belt locks, latches and rolls back.", mon:"A belt is slow to roll back in.", fix:"Any belt that doesn’t lock or latch, or is cut. Nobody sits in that seat until it’s fixed."},
  'cab-warn': {w:"Warning lights are the vehicle’s way of saying something is wrong. When you switch on, they all light up for a few seconds as a test, then go off. One that stays on means a problem.", h:["Turn the key to “on” without starting: the lights come on.", "Start the engine. Within a few seconds they should all go off.", "If any stay on, photograph the dashboard and note which one."], ok:"All go off.", mon:"A yellow or orange light stays on: get it checked soon.", fix:"A red light (oil, temperature, brakes, battery) or a flashing engine light: don’t drive."},
  'cab-horn': {w:"The horn warns people and animals. It’s also checked at a roadworthy test.", h:["Press the horn briefly. It should be loud and clear."], ok:"Works.", mon:"Weak.", fix:"Doesn’t work."},
  'cab-seats': {w:"Seats must be firmly attached. A loose seat can break off in a crash, and the driver must be able to adjust the seat to reach the pedals properly.", h:["Push and pull each seat. It must not wobble.", "Move the driver’s seat forward and back and adjust the backrest. It must lock in place.", "For seats that fold or come out (in vans), check the latches lock."], ok:"All secure.", mon:"A loose cover or a stiff lever.", fix:"A seat that wobbles or won’t lock."},
  'cab-upholst': {w:"Torn seats get worse quickly, look bad to guests, and bring the price down when the vehicle is sold. Stains are easier to clean when they’re fresh.", h:["Look at each seat for tears, holes and stains.", "Photograph new damage so you know when it happened and who had the vehicle."], ok:"No new damage.", mon:"New stain or small tear.", fix:"Big tears, or broken springs poking through."},
  'cab-ac': {w:"In South African summer, a vehicle without aircon can get dangerously hot for passengers, especially children and older people. Weak aircon usually means it needs gas or a service.", h:["Start the engine and set the aircon to cold with the fan on.", "After 2 to 3 minutes, the air from the vents should be properly cold."], ok:"Cold air.", mon:"Cool but not cold: book an aircon check.", fix:"Blows warm, or smells burnt."},
  'cab-heat': {w:"The demister clears a fogged-up windscreen on cold or rainy mornings. Without it, the driver can’t see.", h:["Once the engine is warm, set the temperature to hot and the air to the windscreen.", "Warm air should come out and clear the glass."], ok:"Clears the windscreen.", mon:"Slow to clear.", fix:"No warm air, or the windscreen stays fogged."},
  'cab-fan': {w:"The fan pushes the air through. If some speeds don’t work, a small part (the resistor) usually needs replacing.", h:["Turn the fan through each speed. Each should be stronger than the last."], ok:"All speeds work.", mon:"One speed doesn’t work.", fix:"Fan doesn’t work at all."},
  'cab-gauges': {w:"Gauges tell the driver how fast they’re going, how much fuel is left and whether the engine is too hot. A broken speedometer leads to speeding fines; a broken fuel gauge leads to running out of fuel.", h:["On a drive, check the speedometer and rev counter move.", "Check the fuel gauge matches what you expect.", "Once the engine is warm, the temperature needle should sit in the middle."], ok:"All work.", mon:"A gauge is jumpy.", fix:"Speedometer, fuel or temperature gauge doesn’t work."},
  'cab-locks': {w:"Doors must lock to keep the vehicle and what’s inside it safe.", h:["Lock with the remote. Every door, including the sliding and back doors, should lock and the indicators flash.", "Unlock: every door should open.", "Also try the key in the driver’s door."], ok:"All lock and unlock.", mon:"Remote only works close up.", fix:"A door doesn’t lock."},
  'cab-handles': {w:"Passengers must be able to get out quickly in an emergency. Child locks stop children opening the back doors while driving, but must be off when adults travel so they can get out.", h:["Open each door from the inside.", "Find the child lock switch on the edge of the back or sliding doors and check it works. Set it the way it’s needed."], ok:"All open from inside.", mon:"A handle is stiff.", fix:"A door can’t be opened from inside (with the child lock off)."},
  'cab-mats': {w:"A loose mat can slide forward and jam under the brake or accelerator pedal. This has caused serious accidents.", h:["Check the driver’s mat is clipped in, or lies flat and can’t slide.", "Press each pedal all the way down. Nothing should get in the way.", "Never put two mats on top of each other."], ok:"Secure and clear.", mon:"Mat slides a little.", fix:"A mat bunches up under the pedals."},
  'cab-radio': {w:"Not a safety item, but drivers use it for navigation and hands-free calls, and a working radio shows the vehicle is cared for.", h:["Switch on the radio and check the sound from all speakers.", "Test Bluetooth or a phone connection if it has one."], ok:"Works.", mon:"A speaker or Bluetooth doesn’t work.", fix:"(Rarely urgent.)"},
  'cab-usb': {w:"Drivers need to charge phones for navigation and emergencies on long trips.", h:["Plug a phone into each socket. It should start charging."], ok:"All work.", mon:"One doesn’t work.", fix:"(Rarely urgent.)"},
  'cab-trim': {w:"A sagging roof lining or loose trim looks bad, can hang into the driver’s view, and brings the price down when selling. (WeBuyCars noted a sagging roof lining on JYD.) Sun visors must stay where you put them.", h:["Look at the roof lining for sagging.", "Look for loose or missing trim pieces.", "Fold the sun visors down and up. They should stay put."], ok:"All in place.", mon:"Some sagging or a loose piece.", fix:"Lining or trim hanging into the driver’s view."},
  'cab-clean': {w:"Guests and teams use these vehicles, so a clean vehicle makes a good first impression. Rubbish attracts rats and mice, and things left behind (phones, documents) need to be returned.", h:["Check under and between the seats and in the door pockets.", "Remove rubbish. Keep any lost items safe and report them.", "Shake out the mats and wipe the dashboard if it’s dirty."], ok:"Clean, nothing left behind.", mon:"Needs a clean.", fix:"Very dirty, food or rubbish left, or a bad smell."},

  'pre-kit': {w:"If a tyre bursts on a trip, the driver needs a working spare, a jack and wheel spanner, and a triangle to warn traffic. Without them, a simple puncture becomes a long and dangerous wait on the side of the road.", h:["Check the warning triangle is in the vehicle.", "Check the jack and wheel spanner are there.", "Check the spare wheel is there and not flat."], ok:"All there.", mon:"", fix:"Anything missing."},
  'saf-triangle': {w:"When the vehicle breaks down on the road, a warning triangle placed well behind it tells other drivers to slow down before they reach you.", h:["Find the triangle (often in the boot or under a seat).", "Open it up. It should stand up and the reflectors shouldn’t be broken.", "Remember: put it about 45 m behind the vehicle, roughly 60 big steps."], ok:"There and in good shape.", mon:"Damaged but usable.", fix:"Missing."},
  'saf-firstaid': {w:"If someone gets hurt, the first few minutes matter. A stocked first-aid kit lets you stop bleeding, clean wounds and protect yourself with gloves while waiting for help.", h:["Open the kit.", "Check for gloves, bandages, plasters, gauze, antiseptic, scissors and a CPR mouthpiece.", "Check expiry dates, and replace anything that was used."], ok:"Complete and in date.", mon:"A few items missing or expired.", fix:"No kit, or it’s empty."},
  'saf-extinguisher': {w:"A small fire in the engine bay can be put out early with an extinguisher, before it spreads. An empty or expired one is useless.", h:["Check it’s firmly mounted so it can’t roll around.", "Look at the gauge: the needle must be in the green.", "Check the service tag date. Extinguishers are usually serviced every year."], ok:"Needle in green, service in date.", mon:"Service date has passed.", fix:"Needle in red, seal broken, or missing."},
  'saf-jack': {w:"Without a jack and wheel spanner, nobody can change a flat tyre.", h:["Find the jack and wheel spanner and check nothing is missing.", "Check the spanner fits the wheel nuts, and the locknut key is with it."], ok:"Complete.", mon:"", fix:"Missing or broken."},
  'saf-vest': {w:"Anyone standing next to the road after a breakdown could be hit. A reflective vest makes them visible from far away, especially at night.", h:["Check there’s at least one vest within reach of the driver, not buried under luggage."], ok:"There.", mon:"", fix:"Missing."},
  'saf-torch': {w:"Breakdowns often happen at night. A torch is needed to look at the engine, change a tyre or signal for help.", h:["Switch it on to check the batteries."], ok:"Works.", mon:"Weak light: replace the batteries.", fix:"Missing or dead."},
  'saf-card': {w:"In an emergency, the driver needs the right phone numbers fast: the FFSA vehicle coordinator, the insurer and roadside assistance, the tracking company, and emergency services (10111 for police, 112 from a cellphone).", h:["Check the card is in the cubby hole or on the sun visor.", "Check it has the vehicle coordinator\u2019s number and the insurer\u2019s claims and roadside-assistance numbers. The insurance and registration papers themselves stay in the legal office.", "Check the numbers are current."], ok:"There and current.", mon:"Some numbers are old.", fix:"Missing."},

  'drv-start': {s:"Do the road test on a quiet road or in an empty parking area, with your seat belt on.", w:"An engine that’s slow to start often warns of a weak battery or starter motor before it leaves someone stranded.", h:["On a diesel, turn the key to “on” and wait for the coil-shaped glow plug light to go off first.", "Start the engine. It should start within a few seconds.", "Listen while it idles. It should run smoothly without shaking or stumbling."], ok:"Starts quickly, runs smoothly.", mon:"Slow to start, or rough for the first few seconds.", fix:"Hard to start, or shakes and misfires."},
  'drv-noise': {w:"New noises are early warnings. Knocking can mean engine trouble, whining can mean a worn pump or bearing, and rattling is often a loose heat shield or suspension part.", h:["Drive with the radio off and the windows slightly open.", "Listen while you speed up, brake, turn and go over bumps.", "Note when the noise happens and where it seems to come from."], ok:"No unusual noises.", mon:"A small rattle or squeak.", fix:"Knocking, grinding, or a loud whine."},
  'drv-smoke': {w:"The colour of exhaust smoke is a clue. Blue smoke means the engine is burning oil. Black smoke means too much fuel (common on worn diesels). Thick white smoke that smells sweet can mean coolant is burning, a head gasket sign. Thin white vapour on a cold morning is normal.", h:["Ask someone to watch the exhaust while you start the engine and rev it.", "Or watch in the mirror as you pull away."], ok:"No visible smoke once warm.", mon:"A puff of black smoke when accelerating hard (diesel).", fix:"Blue smoke, constant black smoke, or thick white smoke."},
  'drv-gears': {w:"Jerky or slipping gear changes can mean the gearbox needs a service. Gearbox repairs are very expensive, so catching problems early matters.", h:["Standing still with your foot on the brake, select D, then R. Each should engage within about a second, with no clunk.", "Move off in D and in R: it should pull away smoothly.", "Drive normally and feel each gear change: smooth, without jerks, delays or the revs jumping."], ok:"Smooth changes.", mon:"An occasional hard or late change.", fix:"Slips, bangs into gear, or won’t go into gear."},
  'drv-clutch': {w:"On a manual, a slipping clutch wastes fuel and eventually leaves the vehicle unable to drive.", h:["In 3rd or 4th gear, accelerate firmly. If the revs rise but the speed doesn’t, the clutch is slipping.", "Check the pedal bites at a normal height and isn’t very heavy."], ok:"Bites normally, no slipping.", mon:"Bites very high.", fix:"Slips, or very heavy. Mark N/A on automatics."},
  'drv-pull': {w:"If the vehicle pulls to one side, a tyre may be soft, the wheels may be out of alignment, or a brake may be sticking. It tires the driver and wears tyres quickly.", h:["On a straight, flat road with no traffic, relax your grip on the steering wheel for a moment.", "The vehicle should keep going straight."], ok:"Goes straight.", mon:"Slight pull: check tyre pressures and book an alignment.", fix:"Strong pull to one side."},
  'drv-steer': {w:"A shaking steering wheel usually means a wheel is out of balance or a rim is bent. A crooked steering wheel while driving straight means the alignment is out.", h:["Drive at 80 to 100 km/h on a smooth road and feel the steering wheel.", "Check the steering wheel is straight when the vehicle drives straight."], ok:"Straight, no shaking.", mon:"Slight shake at certain speeds: book wheel balancing.", fix:"Strong shaking, or loose, wandering steering."},
  'drv-brakes': {w:"Brakes are the most important safety system. Grinding can mean the pads are worn down to the metal, and pulling to one side can make the vehicle swerve in an emergency stop.", h:["On an empty road at about 40 km/h, check behind you, then brake firmly.", "The vehicle should stop in a straight line.", "Listen for grinding or squealing, and feel for shuddering in the pedal."], ok:"Stops straight and quietly.", mon:"Light squeal, or slight shudder.", fix:"Grinding, pulling to one side, or poor stopping."},
  'drv-pedal': {w:"A soft or spongy brake pedal can mean air or a leak in the brake system. The brakes could fail suddenly.", h:["With the engine running and the vehicle standing still, press the brake pedal firmly.", "It should feel firm, stop well above the floor, and not slowly sink."], ok:"Firm.", mon:"Slightly soft.", fix:"Spongy, or sinks towards the floor."},
  'drv-hand': {s:"Use a gentle slope with nobody behind the vehicle, and keep your foot ready on the brake.", w:"The handbrake stops a parked vehicle rolling away, which could hurt someone or cause a crash. On an automatic, P also holds the vehicle, so a weak handbrake can go unnoticed until the day someone parks in N or the P lock fails.", h:["Stop on a slope with your foot on the brake.", "Move the gear lever to N (neutral). Don’t test in P: in P the gearbox holds the vehicle, so you wouldn’t know whether the handbrake works.", "Pull up the handbrake (or press the electric parking brake button) and count the clicks.", "Gently lift your foot off the brake pedal. The vehicle must not move.", "Foot back on the brake, and select P before you get out."], ok:"Holds firmly in N.", mon:"Holds, but needs many clicks.", fix:"Vehicle rolls in N."},
  'drv-temp': {w:"If the engine gets too hot, it can be badly damaged within minutes. The temperature needle should stay in the middle.", h:["After 10 to 15 minutes of driving, check the temperature needle.", "It should sit around the middle, also in slow traffic."], ok:"Stays in the middle.", mon:"Rises a little in traffic, then comes back.", fix:"Goes above the middle or the warning light comes on: stop safely and switch off."},
  'drv-abs': {w:"ABS stops the wheels locking in an emergency stop, so the driver can still steer around danger. If its light stays on, ABS may not work when it’s needed.", h:["Watch the ABS and traction-control lights after starting and while driving. They should stay off."], ok:"Lights stay off.", mon:"", fix:"ABS or traction light stays on."},
  'drv-cruise': {w:"Cruise control helps on long trips, but it must switch off the moment the driver touches the brake.", h:["On an open road, set the cruise control.", "Touch the brake. It must switch off immediately."], ok:"Works and switches off.", mon:"Doesn’t set.", fix:"Doesn’t switch off with the brake. Mark N/A if there’s no cruise control."},

  'wrk-padf': PAD_HELP, 'wrk-padr': PAD_HELP,
  'wrk-discs': {w:"Brake discs (and drums at the back on some vehicles) are what the pads grab. Worn or warped discs make the steering or pedal shake when braking and reduce stopping power.", h:WS, ok:"Within limits.", mon:"Worn: replace with the next pads.", fix:"Below the limit, cracked or badly warped."},
  'wrk-lines': {w:"Brake pipes and hoses carry the brake fluid. A leaking or cracked one can make the brakes fail.", h:WS, ok:"No leaks or cracks.", mon:"Surface rust or small cracks.", fix:"Leaking or badly corroded."},
  'wrk-shocks': {w:"Shock absorbers stop the vehicle bouncing. Worn ones make it sway, take longer to stop and wear tyres faster, which matters a lot in a full van.", h:WS, ok:"No leaks, good damping.", mon:"Weak.", fix:"Leaking or broken."},
  'wrk-bushes': {w:"Rubber bushes and ball joints connect the wheels to the vehicle and let them move. Worn ones cause clunks and poor handling, and a badly worn ball joint can let a wheel collapse.", h:WS, ok:"No play.", mon:"Slight wear.", fix:"Excessive play or torn."},
  'wrk-tierod': {w:"Tie rods connect the steering wheel to the front wheels. Worn ones make the steering loose and the vehicle wander.", h:WS, ok:"No play.", mon:"Slight play.", fix:"Loose steering."},
  'wrk-cv': {w:"CV joints let the front wheels turn while the engine drives them. If the rubber boot tears, the grease falls out and the joint fails. A clicking sound when turning is the warning sign.", h:WS, ok:"Boots intact.", mon:"Boot cracking.", fix:"Boot torn, or the joint clicks."},
  'wrk-bearings': {w:"Wheel bearings let the wheels spin smoothly. A worn bearing hums or growls, and can eventually seize.", h:WS, ok:"Quiet, no play.", mon:"Slight noise.", fix:"Loud noise or play."},
  'wrk-exhaust': {w:"A leaking exhaust can let fumes, including poisonous carbon monoxide, into the cabin. Loose parts can fall off on the road.", h:WS, ok:"Secure, no leaks.", mon:"Rusty.", fix:"Leaking, or loose mountings."},
  'wrk-gbox': {w:"The gearbox and differential need their oil. A leak that runs them dry causes very expensive damage.", h:WS, ok:"Dry.", mon:"Slight seepage.", fix:"Dripping."},
  'wrk-fuel': {w:"A fuel leak is a fire risk.", h:WS, ok:"No leaks.", mon:"", fix:"Any fuel leak or smell."},
  'wrk-chassis': {w:"The chassis is the vehicle’s backbone. Damage or rust through it makes the vehicle unsafe in a crash and fails a roadworthy test.", h:WS, ok:"Sound.", mon:"Surface rust.", fix:"Damage or rust through the metal."},
  'wrk-scan': {w:"A diagnostic computer reads fault codes stored in the vehicle’s computer, even problems that haven’t switched on a warning light yet.", h:WS, ok:"No codes.", mon:"Old or minor codes.", fix:"Active fault codes that need repair."},
  'wrk-align': {w:"Wheel alignment makes the wheels point straight. When it’s out, tyres wear on one edge and the vehicle pulls.", h:WS, ok:"Within spec.", mon:"Slightly out.", fix:"Far out, or tyres wearing badly."},
  'wrk-coolant': {w:"Coolant needs the right mix to protect the engine from rust and overheating. The workshop tests its strength.", h:WS, ok:"Correct strength.", mon:"Weak.", fix:"Contaminated, or oil in the coolant."},
  'wrk-acgas': {w:"The aircon needs the right amount of gas to blow cold. Low gas usually means a small leak.", h:WS, ok:"Correct.", mon:"Low: regas.", fix:"Empty or leaking."}
};

/* ---------- Detailed guide: what each part should look like (l) and what goes wrong (f: [problem, how to spot it]) ---------- */
const GUIDE = {
  'pst-driver': {l:"A good handover is a short chat at the vehicle, keys in hand, before the driver walks away.", f:[["A problem nobody mentions", "Drivers often forget small things. Ask each question one by one rather than “All fine?”."],["A warning light that came and went", "Ask: “Did any light come on, even for a moment?” Lights that flicker on and off are still worth checking."],["A knock or bump", "Ask about potholes, kerbs, gravel roads and parking. Then look at that corner of the vehicle yourself."]]},
  'pst-keys': {l:"Every key goes back on its own labelled hook or tag. The remote has buttons that press and spring back. The locknut key is a small, round socket with a pattern on its end, usually in a little bag.", f:[["Key or remote missing", "Count them against what was handed out."],["Weak remote battery", "The remote only works when you stand right next to the vehicle, or you must press several times."],["Damaged key", "A bent blade, a cracked case or a loose button."]]},
  'doc-disc': {l:"A round paper disc, about the size of a coaster, in a clear holder on the inside of the windscreen, usually at the bottom left as you sit in the driver’s seat. It shows the registration number, the VIN, the engine number and the expiry date.", f:[["Expired disc", "The expiry date has passed."],["Wrong disc", "The registration number on the disc doesn’t match the number plate."],["Unreadable disc", "Faded by the sun, wet, or the holder has fallen off."],["Disc missing", "The holder is empty. A new disc may be in the office and not yet fitted."]]},
  'doc-service': {l:"The service book is a small booklet with a page for each service. Each page has the date, the km, the work done and the workshop’s stamp. Some vehicles have invoices in a file instead.", f:[["Missing stamps", "A service happened (there’s an invoice) but the book wasn’t stamped."],["Gap in the history", "A long time or many km between two stamps."],["Book missing", "Nobody knows where it is: check the office file and the cubby hole."]]},
  'doc-keys': {l:"The spare key is kept in the office key safe, not in the vehicle. It should look like the main key and open the vehicle.", f:[["Spare is missing", "It isn’t in the key safe."],["Spare doesn’t work", "It won’t turn in the door lock or start the vehicle."],["Flat remote battery", "The spare’s remote doesn’t lock or unlock the doors."]]},
  'doc-tracker': {l:"The tracking unit is hidden inside the vehicle, so you check it through the tracking company’s app or website, which should show the vehicle on a map where it really is.", f:[["Unit not reporting", "The map shows an old location or an old date and time."],["Tampering", "Loose wires under the dashboard, or a fuse missing."],["Immobiliser fault", "The vehicle won’t start with the right key, or a security light keeps flashing."]]},

  'ext-walk': {l:"Paint should look smooth with an even shine. Panels should line up with even gaps between them, about the width of a finger. Every light, mirror and badge should be in place.", f:[["New dent", "Look along the panel at an angle with the light behind you: a dent makes the reflection bend or wobble."],["New scratch", "A bright line, or a line of different colour, on the paint. Run a fingernail across it: if the nail catches, it’s deep."],["Scuffed corners", "Grey or black marks and scraped paint on bumper corners, from parking."],["Cracked or broken parts", "Cracks in lights, mirror covers or bumpers, or pieces missing."]]},
  'ext-front': {l:"The front bumper is the big plastic part below the headlights. It should sit flush, with even gaps to the headlights and wings. The grille (the slatted part in the middle) should be complete.", f:[["Loose bumper", "A gap that is wider on one side, or the bumper moves when you push it gently."],["Cracked paint or plastic", "Thin lines in the paint, often around old repairs."],["Missing clips", "The bumper edge sticks out near the wheel arch."],["Broken grille", "Missing slats, or holes where stones went through."]]},
  'ext-rear': {l:"The rear bumper wraps around the back of the vehicle under the tailgate or boot. It should sit flush with even gaps to the body and lights.", f:[["Hanging corner", "A corner drops away from the body, often from broken clips."],["Parking damage", "Scuffs, scrapes or dents at the corners."],["Broken sensors", "Small round parking sensors pushed in, cracked or missing."]]},
  'ext-bonnet': {l:"The bonnet should sit level, with the same gap on both sides, and line up with the wings and headlights.", f:[["Stone chips", "Small white or dark dots on the front edge, where paint has chipped off."],["Bonnet not latched", "One side sits higher, or the edge lifts when you pull on it."],["Hail or dents", "Wobbly reflections across the top."]]},
  'ext-left': {l:"The left side: front wing, doors, sliding door or rear doors, and the rear quarter panel behind the back wheel. Doors should close flush with the body and with even gaps.", f:[["Door dings", "Small round dents at about knee to waist height, from other car doors."],["Long scrape", "A scratch along several panels, from a pole, wall or another vehicle."],["Door out of line", "The door sticks out at one edge, or needs a hard slam to close."]]},
  'ext-right': {l:"The right side: front wing, doors, and the rear quarter panel behind the back wheel. Doors should close flush with the body and with even gaps.", f:[["Door dings", "Small round dents at about knee to waist height, from other car doors."],["Long scrape", "A scratch along several panels, from a pole, wall or another vehicle."],["Door out of line", "The door sticks out at one edge, or needs a hard slam to close."]]},
  'ext-roof': {l:"The roof should be smooth and evenly coloured. The gutters (the channels along the edges of the roof) should be clear. A roof rack should be bolted down tight with no rust around its feet.", f:[["Hail damage", "Lots of small round dents, easiest to see with the light low."],["Blocked gutters", "Leaves, sand or dirt in the channels."],["Loose roof rack", "It moves or creaks when you push it."],["Rust", "Orange-brown spots or bubbled paint around the rack feet or the edges."]]},
  'ext-slide': {l:"A sliding door runs on rails: one at the top, one at the bottom (inside the step area) and one along the side of the vehicle at the back. The rails should be clean, the door should slide freely, and it should lock open at the end with a click.", f:[["Dirt in the rails", "Sand or grit in the lower rail; the door feels gritty or noisy."],["Worn rollers or catches", "The door drops when you open it, scrapes the body, or won’t latch."],["Door won’t stay open", "It rolls back on a slope: dangerous for fingers."],["Door-open warning when closed", "The dashboard says a door is open when it isn’t: a sensor or latch fault."]]},
  'ext-tail': {l:"The tailgate or boot lid should open with the handle or button, rise and stay up by itself (held by gas struts, the shiny rods at the sides), and close and lock with one firm push.", f:[["Weak gas struts", "The tailgate drifts down or drops on its own."],["Latch fault", "It needs a hard slam, or springs open again."],["Broken handle", "The handle moves but nothing happens."],["Lock fault", "It stays unlocked when the rest of the vehicle locks."]]},
  'ext-fuelcap': {l:"Behind a small flap on the side of the vehicle. The cap should be there, with its rubber seal intact, and click when tightened. Tip: the little arrow next to the fuel pump symbol on the fuel gauge shows which side the flap is on.", f:[["Missing cap", "An open filler neck, or a temporary cap."],["Cap doesn’t click", "It turns without clicking, or comes off easily."],["Fuel smell", "A strong smell of diesel or petrol near the flap."]]},
  'ext-plates': {l:"Reflective plates with black letters and the province strip, bolted or riveted on firmly at the front and back. All letters must be clear.", f:[["Loose or missing plate", "It rattles, hangs at an angle, or is gone."],["Cracked or faded plate", "Cracks through the letters, or letters you can’t read from 20 m."],["Dirty plate", "Mud over the letters, common after gravel roads."]]},
  'ext-rust': {l:"Look low down: the sills (the strip under the doors), the bottom edges of the doors, and around the wheel arches. Paint here should be smooth and the same colour as the rest of the vehicle.", f:[["Surface rust", "Small orange-brown spots."],["Bubbling paint", "Little blisters in the paint. Rust is growing underneath."],["Rust holes", "Flaking metal or holes. This fails a roadworthy test."]]},
  'ext-seals': {l:"Black rubber strips around every door, window and the tailgate. They should be soft, unbroken and pressed firmly into place.", f:[["Torn rubber", "Splits or missing pieces, often at the bottom corners."],["Seal pulled loose", "A loop of rubber hanging out of the door frame."],["Water inside", "Damp carpets, a musty smell, or water marks after rain."]]},
  'ext-towbar': {l:"A metal ball on a bracket under the back bumper, with a round electrical socket next to it. The ball should be rigid and the socket cover should close.", f:[["Loose tow ball", "It moves when you shake it hard."],["Corroded socket", "Green or white powder inside the socket; trailer lights don’t work."],["Bent bracket", "The ball sits crooked."]]},

  'gls-wind': {l:"The windscreen should be clear glass with no marks in front of the driver. A chip looks like a tiny star or bullseye; a crack is a line that may grow.", f:[["Stone chip", "A small star or bullseye, easiest to see from outside at an angle."],["Crack", "A line, often starting from a chip or the edge of the glass."],["Wiper scratches", "Curved scratch lines across the glass from worn blades."],["Sandblasting", "The glass looks hazy or glary when you drive into the sun."]]},
  'gls-side': {l:"All side and back windows should be clear and complete. Window tint should be smooth with no bubbles over the driver’s view.", f:[["Crack or chip", "Lines or chips in the glass."],["Broken window", "Glass missing or covered with plastic: a security risk."],["Peeling tint", "Bubbles or loose film, especially on the driver’s window."]]},
  'gls-winders': {l:"With the ignition on, each window should go all the way down and all the way up smoothly in a few seconds, and stop by itself at the top.", f:[["Slow or jerky window", "The motor or the rails are wearing out."],["Window drops or tilts", "The glass slides down on its own or goes up crooked: a broken regulator."],["Switch doesn’t work", "Nothing happens from one switch, but the window works from the driver’s switch."]]},
  'gls-mirrors': {l:"Both side mirrors fixed firmly to the doors, the glass complete with no cracks, and the mirrors can be adjusted so the driver sees the lane beside the vehicle.", f:[["Cracked glass", "Lines across the mirror; the view is broken up."],["Loose mirror", "It flops when you touch it or shakes while driving."],["Missing cover", "The coloured cover on the back is gone."],["Adjuster broken", "The mirror won’t move with the switch or by hand."]]},
  'gls-rvm': {l:"The inside mirror is fixed to the windscreen or roof. It should be firm, the glass clear, and the driver should be able to see out of the back window.", f:[["Loose mirror", "It droops or wobbles while driving."],["Fallen off", "The mount has come away from the windscreen."]]},
  'gls-blades': {l:"Each blade is a thin strip of rubber on a metal or plastic arm. The rubber edge should be straight, soft and smooth, with no cracks or tears.", f:[["Hard or cracked rubber", "Run a finger along the edge: it feels rough or crumbly."],["Torn blade", "A piece of rubber hanging loose."],["Smearing or streaks", "Lines of water left behind after a wipe."],["Judder", "The blade jumps and chatters across the glass."]]},
  'gls-wipers': {l:"The wiper stalk is on the steering column. Its settings are: off, intermittent (on-and-off), slow, fast, and one quick wipe. The wipers should sweep smoothly and park at the bottom of the windscreen.", f:[["Wipers don’t move", "Blown fuse or a failed motor."],["Missing speed", "One setting does nothing."],["Wipers stop mid-screen", "They don’t park at the bottom when switched off."]]},
  'gls-washer': {l:"Pull the wiper stalk towards you to spray. The jets are small nozzles on the bonnet or under the wiper arms. The spray should hit the middle of the windscreen.", f:[["Nothing comes out", "The tank is empty, or the pump has failed (listen for a buzz)."],["Blocked jet", "One jet sprays weakly or not at all."],["Bad aim", "The spray goes over the roof or hits the bottom of the glass."]]},

  'pre-lights': {l:"Every light should light up clearly and evenly. Indicators should flash at a steady speed, roughly once a second.", f:[["Blown bulb", "One light is dark while its partner on the other side works."],["Fast flashing indicator", "Usually a blown indicator bulb on that side."],["Dim light", "A dirty or yellowed lens, or a bad connection."]]},
  'lgt-dip': {l:"Two headlights on the normal setting light the road ahead and slightly to the left, with a clear cut-off line at the top.", f:[["One headlight out", "Only one side lights the road."],["Aimed too high", "Oncoming cars flash their lights at you."],["Water inside", "Fog or droplets inside the headlight."]]},
  'lgt-bright': {l:"Brights light the road much further ahead. A blue headlight symbol shows on the dashboard.", f:[["Brights don’t work", "The beam doesn’t get stronger and the blue light doesn’t show."],["One side only", "Only one headlight brightens."]]},
  'lgt-park': {l:"Small white or amber lights at the front corners and red lights at the back, on whenever the light switch is on. Some vehicles also have daytime running lights.", f:[["Bulb out", "One corner is dark."],["Not switching on", "None of the park lights work: a fuse or a switch fault."]]},
  'lgt-ind': {l:"Amber lights at the front, on the sides (on the wings or mirrors) and at the back. They flash about once a second, with a ticking sound and a green arrow on the dashboard.", f:[["Blown indicator bulb", "The indicator on that side flashes fast or stays on without flashing."],["Broken side repeater", "The small light on the wing or mirror is cracked or dark."],["Faded lens", "The amber colour is weak in daylight."]]},
  'lgt-hazard': {l:"The hazard button has a red triangle on it, usually in the middle of the dashboard. All the indicators flash together.", f:[["Button doesn’t work", "Nothing flashes, or only some lights flash."],["Stuck button", "The hazards won’t switch off."]]},
  'lgt-brake': {l:"Two bright red lights at the back, plus a high third light at the top of the back window or tailgate. They come on only while the brake pedal is pressed and are brighter than the tail lights.", f:[["One brake light out", "A blown bulb."],["All brake lights out", "A failed brake light switch at the pedal, or a fuse."],["Third light dark", "The high light doesn’t come on."],["Brake lights stuck on", "They stay on when you’re not braking."]]},
  'lgt-tail': {l:"Two red lights at the back that come on with the headlights. They are dimmer than the brake lights.", f:[["Tail light out", "One side is dark at night."],["Cracked lens", "White light shows through a crack."]]},
  'lgt-reverse': {l:"White lights at the back that come on only when reverse is selected.", f:[["Reverse light out", "No white light in reverse."],["Light always on", "A switch fault on the gearbox."]]},
  'lgt-plate': {l:"One or two small white lights above the back number plate, lighting the plate at night.", f:[["Bulb out", "The plate is dark at night."],["Water in the lamp", "Rust or water inside the small cover."]]},
  'lgt-fog': {l:"Small lights low in the front bumper, and sometimes one bright red light at the back, switched on separately. A fog light symbol shows on the dashboard.", f:[["Fog light out", "One side is dark."],["Broken lens", "Cracked or stone-damaged glass, low in the bumper."]]},
  'lgt-lens': {l:"Headlight covers should be clear like glass, with no cracks, holes or water inside.", f:[["Yellowed or cloudy cover", "The plastic looks frosted; light at night is weak and scattered."],["Cracked cover", "A crack or stone hole lets water in and blows bulbs."],["Condensation", "Mist or droplets inside the light."]]},
  'lgt-cabin': {l:"Roof lights inside the cabin and the load area. Each one usually has three settings: on, off, and on when a door opens.", f:[["Light doesn’t work", "A bulb or switch fault."],["Light stays on", "A door switch is stuck. This can flatten the battery overnight."]]},
  'lgt-reflect': {l:"Red reflectors at the back (often built into the bumper or lights), and on vans sometimes reflective tape on the sides and back. They should be clean and complete.", f:[["Missing reflector", "A gap where the reflector should be."],["Dirty or faded tape", "It doesn’t shine when torchlight hits it."]]},

  'pre-tyres': {l:"All four tyres should look the same: round at the bottom with a slight bulge where they touch the ground. The sides should be smooth, with no cuts or lumps.", f:[["Soft tyre", "One tyre bulges more at the bottom than the others."],["Puncture", "A nail or screw head in the tread, or a hissing sound."],["Sidewall bulge", "A round lump on the side of the tyre. Don’t drive on it."]]},
  'tyr-spare': {l:"A full wheel and tyre, the same as the others or a thinner space-saver, held firmly in place with air in it.", f:[["Flat spare", "Squeeze it, or check it with a pressure gauge: spares lose air slowly while they wait."],["Worn or old spare", "Low tread, or cracks in the rubber."],["Missing spare", "The carrier or well is empty."],["Seized carrier", "On vans with the spare underneath, the lowering bolt or winch is rusted and won’t turn."]]},
  'tyr-press': {l:"The pressure sticker shows the right pressure for the front and the back tyres, often with a higher “full load” number. A pressure gauge reads in bar or kPa (2.2 bar is 220 kPa).", f:[["Low pressure", "The gauge reads below the sticker."],["Slow puncture", "The same tyre is low again a few days after pumping it up."],["Leaking valve", "Hissing at the valve when you press it lightly, or a missing valve cap."]]},
  'tyr-side': {l:"The sidewall is the smooth side of the tyre with the size and brand written on it. It should be smooth and evenly black.", f:[["Bulge", "A round lump: the inside of the tyre is broken. It can burst."],["Cut or gash", "A slice in the rubber, often from a kerb or sharp stone."],["Cracking", "Lots of fine cracks, a sign of an old tyre."],["Kerb rash", "Scuffs where the tyre rubbed a kerb."]]},
  'tyr-wear': {l:"The tread should be about the same depth across the whole width of each tyre: inner edge, middle and outer edge.", f:[["Inner or outer edge worn", "Wheel alignment is out."],["Both edges worn", "The tyre has been driven too soft."],["Middle worn", "The tyre has been pumped too hard."],["Patchy or scalloped wear", "Worn shock absorbers or suspension."]]},
  'tyr-nuts': {l:"Each wheel has the same number of shiny nuts or bolts in a circle (usually 5 or 6). One per wheel may be a special locking nut with a pattern on its face.", f:[["Missing nut", "A gap in the circle of nuts."],["Loose nut", "A rust-coloured streak running out from a nut."],["Damaged locknut", "The pattern on the locking nut is chewed, so the key won’t fit."]]},
  'tyr-rims': {l:"The rim is the metal wheel. Its edge should be round and smooth, with no cracks or missing pieces.", f:[["Bent rim", "A flat spot or dent on the edge; the steering wheel shakes at speed."],["Cracked rim", "A fine line, often near the spokes or the edge. A slow leak is common."],["Kerb damage", "Scraped or chipped edges."]]},
  'tyr-age': {l:"On the side of every tyre is a code starting with DOT. The last four numbers in an oval are the week and year it was made: 2321 means week 23 of 2021.", f:[["Old tyre", "Older than 6 years, even if the tread looks fine."],["Mixed ages", "One tyre much older than the others on the same axle."],["Sun cracking", "Fine cracks between the tread blocks or on the sidewall."]]},

  'eng-oil': {l:"The dipstick is a long thin metal stick with a coloured loop handle (usually yellow or orange). At its tip are two marks (MIN and MAX, two dots, or a cross-hatched area). Clean oil looks golden-brown, like honey or tea.", f:[["Low oil", "The oil mark is near or below the bottom mark."],["Black, gritty oil", "Overdue for a service."],["Milky or creamy oil", "Looks like coffee with milk: coolant is getting into the oil, a head gasket sign. Don’t drive."],["Too much oil", "Above the top mark, which can also damage the engine."]]},
  'eng-cool': {l:"A see-through plastic tank with MIN and MAX (or LOW and FULL) marks on its side, connected to the radiator. The liquid inside is coloured: green, pink, blue or orange, depending on the brand.", f:[["Low coolant", "The level is near or below MIN."],["Level keeps dropping", "It needs topping up every week: a leak, or a head gasket or cooler problem."],["Brown or oily coolant", "Rusty or oily: a sign of an internal problem."],["Bubbles in the tank", "Bubbling with the engine running: a head gasket sign."]]},
  'eng-brake': {l:"A small see-through tank at the back of the engine bay on the driver’s side, usually with a yellow cap and MIN and MAX marks. New fluid is clear and golden, like cooking oil.", f:[["Low fluid", "Near MIN: brake pads are worn, or there’s a leak."],["Dark fluid", "Brown or black: the fluid is old and needs changing."],["Wet patch", "Dampness on the tank, the pipes, or the inside of a wheel."]]},
  'eng-ps': {l:"If the vehicle has hydraulic power steering, there’s a small tank with a cap showing a steering wheel symbol, and MIN and MAX marks. Electric power steering has no tank.", f:[["Low fluid", "Below MIN."],["Whining when turning", "A howl or whine when you turn the steering wheel while parked."],["Heavy steering", "It’s hard to turn at low speed."]]},
  'eng-washer': {l:"A large tank with a cap showing a windscreen spray symbol, usually blue or black.", f:[["Empty", "No spray from the jets."],["Leaking tank or pipe", "The tank empties without being used."]]},
  'eng-batt': {l:"A black box with two metal posts on top: + (red cover) and – (black). The cable clamps should be tight and the posts clean and shiny. Some batteries have a little window on top that shows green when the battery is healthy.", f:[["Corroded terminals", "White, green or blue fluffy powder on the posts."],["Loose clamp", "The cable turns or wiggles on the post."],["Swollen or cracked case", "The sides bulge out, or there’s a crack or wetness."],["Weak battery", "The engine turns over slowly when you start it."]]},
  'eng-belt': {l:"A flat black rubber belt with ridges on one side, running around several round pulleys at the front of the engine.", f:[["Cracks", "Small cracks across the ridged side."],["Fraying", "Loose threads at the edges."],["Glazing", "The surface looks shiny and smooth."],["Squealing", "A high squeal when you start the engine or switch on the aircon."]]},
  'eng-hoses': {l:"Thick black rubber pipes, about as wide as a thumb or wider, running between the engine and the radiator. They’re held on with metal clips.", f:[["Soft or swollen hose", "It feels spongy or has a bulge."],["Cracked hose", "Small cracks, especially near the ends."],["Leaking joint", "Wet patches, or white, green or pink crust at the clips."]]},
  'eng-leaks': {l:"The ground under a parked vehicle should be dry. Clear water dripping under the front, after the aircon has been running, is normal.", f:[["Engine oil", "Black or brown drops, sticky and slippery."],["Coolant", "Green, pink or orange drops that smell sweet."],["Gearbox or steering fluid", "Red or brown drops."],["Brake fluid", "Clear, slippery drops near a wheel. Don’t drive."],["Fuel", "A strong diesel or petrol smell, or a rainbow sheen on wet ground."]]},
  'eng-wires': {l:"Wires are bundled in black plastic tubes and tape, clipped neatly along the engine bay. None should hang loose or show bare metal.", f:[["Chewed wires", "Bare copper or bite marks on the plastic."],["Rodent signs", "Nests of leaves or paper, droppings, or food stashed on top of the engine."],["Loose plugs", "A connector hanging unplugged."]]},

  'cab-belts': {l:"Each belt is a flat woven strap. It should be smooth with even edges, pull out freely, lock with a sharp tug, and roll back by itself. The buckle should click and hold.", f:[["Frayed or cut strap", "Fuzzy edges, cuts, or burn marks."],["Belt won’t lock", "A sharp tug pulls more belt out instead of locking."],["Slow to roll back", "The belt stays slack across the seat."],["Faulty buckle", "It won’t click in, or lets go when you pull hard."]]},
  'cab-warn': {l:"When you turn the key to “on”, lots of small symbols light up on the dashboard for a few seconds as a self-test. Once the engine runs, they should all go out. Red means stop; yellow or orange means get it checked soon.", f:[["Oil can symbol (red)", "Low oil pressure: switch off straight away."],["Thermometer symbol (red)", "Engine too hot: stop safely and switch off."],["Battery symbol (red)", "Not charging: the battery will soon go flat."],["Brake symbol (red)", "Low brake fluid or a brake fault. A handbrake that isn’t fully off can also cause it."],["Engine symbol (yellow)", "An engine fault is stored. If it flashes, there’s a serious misfire: stop."],["Coil symbol (yellow, diesels)", "The glow plugs. It should go out before you start. If it stays on or flashes while driving, there’s an engine fault."]]},
  'cab-horn': {l:"Pressing the middle of the steering wheel should give a loud, clear sound.", f:[["Weak or rough horn", "The sound is quiet or croaky."],["No horn", "A fuse or the horn itself has failed."]]},
  'cab-seats': {l:"Each seat should be bolted firmly to the floor and should not rock. Adjusters (levers or knobs) should move freely and lock.", f:[["Loose seat", "It rocks or clicks when you push it."],["Broken adjuster", "The seat slides on its own, or the backrest won’t lock."],["Seat latch fault", "A removable or folding seat won’t lock into its floor mounts."]]},
  'cab-upholst': {l:"Seat covers should be whole and clean, with no holes or loose stitching.", f:[["New stain", "Food, drink or mud marks."],["Tear or hole", "Splits in the fabric or seams."],["Burn mark", "A small melted or brown spot."]]},
  'cab-ac': {l:"With the engine running, the aircon button on (often a snowflake or “A/C”) and the temperature on cold, the air from the vents should feel properly cold within 2 to 3 minutes.", f:[["Blows warm", "Low gas or a compressor fault."],["Cold at first, then warm", "The compressor cuts in and out."],["Bad smell", "A musty smell, from mould in the system."],["Noise when switched on", "A rattle or squeal when the aircon starts."]]},
  'cab-heat': {l:"With the engine warm, the temperature on hot and the air directed at the windscreen, warm air should clear a misted screen within a few minutes.", f:[["No warm air", "Low coolant, or a heater fault."],["Screen won’t clear", "The air doesn’t reach the windscreen, or the screen fogs up again."],["Sweet smell or greasy mist", "A heater leak inside the dashboard. Get it checked."]]},
  'cab-fan': {l:"The fan control has several speeds. Each step should blow harder than the last.", f:[["Some speeds missing", "Only the top speed works: a failed resistor."],["No fan at all", "A fuse or the fan motor."],["Ticking or rattling", "Leaves or dirt caught in the fan."]]},
  'cab-gauges': {l:"The speedometer shows the speed, the fuel gauge the fuel level, and the temperature needle should sit near the middle once the engine is warm.", f:[["Speedometer stuck or jumping", "The needle doesn’t move, or jumps around."],["Fuel gauge wrong", "It shows full after a long trip, or empty after filling up."],["Temperature high", "The needle climbs above the middle."]]},
  'cab-locks': {l:"Pressing lock on the remote should lock every door, including the sliding doors and the tailgate, and the indicators flash once. Unlock should open them all.", f:[["A door doesn’t lock", "One lock motor has failed. Check each door by pulling the handle."],["Remote works only up close", "The remote battery is weak."],["Locks buzz or cycle", "A lock motor is failing."]]},
  'cab-handles': {l:"Every door should open from the inside. The child lock is a small switch or slot on the edge of the back or sliding doors, visible when the door is open.", f:[["Door won’t open from inside", "The child lock is on, or the handle or cable is broken."],["Loose handle", "It flops without opening the door."]]},
  'cab-mats': {l:"The driver’s mat should lie flat and be held in place by clips or hooks so it can’t slide forward.", f:[["Mat slides forward", "It rides up against the pedals."],["Double mats", "One mat on top of another can jam the pedals."],["Worn hole under the heel", "The driver’s heel can catch in it."]]},
  'cab-radio': {l:"The radio should switch on, find stations, and play sound from all speakers.", f:[["No sound", "Fuse, wiring or speaker fault."],["Speaker crackles", "A damaged speaker."],["Asks for a code", "Some radios lock after the battery was disconnected and need a code."]]},
  'cab-usb': {l:"USB ports and 12 V sockets (round, like a cigarette lighter) should charge a phone.", f:[["Socket dead", "A blown fuse, often from a faulty charger."],["Loose socket", "The plug falls out or the charging cuts in and out."]]},
  'cab-trim': {l:"The roof lining should be tight against the roof. Trim panels should be clipped in place with no gaps, and sun visors should stay where you put them.", f:[["Sagging roof lining", "The cloth hangs down in a bubble, usually from the back."],["Loose trim", "Panels rattle or have come off their clips."],["Floppy sun visor", "It drops down on its own."]]},
  'cab-clean': {l:"A clean cabin has no rubbish, sand or food, and nothing left behind in the seat pockets, door pockets or under the seats.", f:[["Food and rubbish", "Wrappers, bottles or crumbs. These attract rodents."],["Lost property", "Phones, chargers, clothes or documents."],["Bad smell", "Spilled food, wet carpets, or smoke."]]},

  'pre-kit': {l:"The warning triangle folds flat in a red case. The jack, the wheel spanner and the spare wheel are in their places.", f:[["Missing items", "The bag or slot is empty."],["Spare not usable", "The spare is flat, worn, or the wrong size."]]},
  'saf-triangle': {l:"A red reflective triangle that folds out and stands on a small base.", f:[["Missing", "Not in the vehicle."],["Broken", "Legs snapped or reflectors cracked."]]},
  'saf-firstaid': {l:"A box or bag marked with a cross. Inside: gloves, bandages of different sizes, plasters, gauze, antiseptic, scissors, a foil blanket and a CPR mouthpiece.", f:[["Items used up", "Empty spaces, opened packets."],["Expired items", "Dates printed on the packets have passed."],["Damp or dirty kit", "Water damage or a broken seal."]]},
  'saf-extinguisher': {l:"A red cylinder held in a bracket, with a small pressure gauge on top. The needle should be in the green zone, the safety pin in place, and the service tag in date.", f:[["Low pressure", "The needle is in the red zone."],["Used or tampered", "The pin is missing or the seal is broken."],["Out of date", "The service tag is more than a year old."],["Loose extinguisher", "It rolls around: in a crash it becomes a missile."]]},
  'saf-jack': {l:"The jack is a small scissor or bottle jack. The wheel spanner is an L-shaped or straight bar with a socket that fits the wheel nuts. The locknut key sits with them.", f:[["Missing jack or spanner", "The storage space is empty."],["Wrong spanner", "It doesn’t fit the wheel nuts."],["Seized jack", "The screw won’t turn."]]},
  'saf-vest': {l:"A bright yellow or orange vest with silver reflective stripes, kept within reach of the driver.", f:[["Missing", "Not in the vehicle."],["Dirty or torn", "The reflective strips no longer shine."]]},
  'saf-torch': {l:"A working torch with fresh batteries, stored in the cubby hole or door pocket.", f:[["Flat batteries", "Weak yellow light, or none."],["Missing", "Not in the vehicle."]]},
  'saf-card': {l:"A card in the cubby hole or on the sun visor with: the FFSA vehicle coordinator’s number, the insurance and roadside-assistance numbers, the tracking company’s number, and emergency numbers (112 from a cellphone, 10111 for police). The registration papers and insurance documents themselves are kept in the legal office.", f:[["Missing card", "Not in the vehicle."],["Old numbers", "A number on the card no longer works, or a person has left."]]},

  'drv-start': {l:"A healthy engine starts within about 2 seconds of turning the key and settles to a smooth, even hum.", f:[["Slow cranking", "The engine turns slowly before starting: a weak battery or starter."],["Several tries needed", "On a diesel, often glow plugs, fuel filter or the battery, especially on cold mornings."],["Rough idle", "The engine shakes, stumbles or the revs hunt up and down."],["Rattle at start-up", "A loud rattle for a few seconds after starting."]]},
  'drv-noise': {l:"Normal sounds: a steady engine hum, some tyre noise and wind. Anything new or rhythmic is worth noting.", f:[["Knocking from the engine", "A deep tapping that speeds up with the engine."],["Whining", "Rises and falls with speed: a bearing, the gearbox or the differential."],["Clunk over bumps", "Worn suspension parts."],["Clicking when turning", "A worn CV joint (front wheels)."],["Rattle from underneath", "A loose heat shield or exhaust."]]},
  'drv-smoke': {l:"With a warm engine, the exhaust should be clear. A little white vapour on a cold morning is normal and disappears once warm.", f:[["Black smoke", "Too much fuel: dirty air filter, injectors or turbo (common on worn diesels)."],["Blue smoke", "The engine is burning oil: worn turbo or engine."],["Thick white smoke that smells sweet", "Coolant is burning: head gasket or cooler problem. Stop and call the workshop."]]},
  'drv-gears': {l:"In an automatic, the gear changes should feel like a gentle nudge, with the revs dropping smoothly after each change. Pulling away in Drive and Reverse should be smooth.", f:[["Harsh or banging changes", "A jolt when changing gear."],["Slipping", "The revs flare up but the vehicle doesn’t speed up."],["Late changes", "The engine revs high before changing up."],["Delay engaging Drive", "A pause, then a clunk, when you select D or R."],["Gearbox warning", "A gearbox light or message on the dashboard."]]},
  'drv-clutch': {l:"On a manual, the clutch pedal should feel even, and the vehicle should start moving when the pedal is about half way up.", f:[["Slipping clutch", "Revs rise but the speed doesn’t, especially going uphill."],["Clutch bites very high", "Near the top of the pedal: a worn clutch."],["Juddering pull-away", "The vehicle shakes when you pull away."]]},
  'drv-pull': {l:"On a straight, flat road the vehicle should keep going straight if you loosen your grip for a moment.", f:[["Pulls to one side", "A soft tyre, wheel alignment, or a sticking brake."],["Wanders", "Needs constant small corrections: worn steering parts."]]},
  'drv-steer': {l:"The steering wheel should be centred when you drive straight and should feel smooth and steady.", f:[["Shake at certain speeds", "Usually at 80 to 110 km/h: a wheel out of balance or a bent rim."],["Crooked steering wheel", "Wheel alignment is out."],["Loose or vague steering", "Worn steering joints."],["Knock when turning", "Worn suspension or steering parts."]]},
  'drv-brakes': {l:"The vehicle should stop in a straight line, quietly, with the pedal feeling firm and smooth.", f:[["Grinding", "A harsh metal-on-metal sound: pads worn right down."],["Squealing", "A high squeal: pads worn to the warning tab, or dust and glazing."],["Pulling while braking", "A stuck or uneven brake on one side."],["Shudder or pulsing pedal", "Warped brake discs."]]},
  'drv-pedal': {l:"With the engine running, the brake pedal should go down a short way and then feel firm, well above the floor.", f:[["Spongy pedal", "It feels soft, like pressing a sponge: air in the brakes."],["Pedal sinks", "It slowly goes towards the floor while you hold it: a leak."],["Hard pedal", "Very hard to press: a brake servo problem."]]},
  'drv-hand': {l:"With the gear lever in N and the handbrake on, the vehicle should stay still on a slope. A lever handbrake usually needs 5 to 8 clicks.", f:[["Doesn’t hold", "The vehicle creeps on a slope."],["Too many clicks", "The lever comes up almost to the top."],["Warning light stays on", "The handbrake light stays on after releasing it."]]},
  'drv-temp': {l:"The temperature needle rises for the first few minutes, then stays in the middle, even in traffic and up hills.", f:[["Needle climbs", "It moves above the middle, especially in slow traffic or on hills."],["Fan doesn’t run", "No fan sound after the engine stops while hot."],["Steam from the bonnet", "Pull over and switch off."]]},
  'drv-abs': {l:"The ABS light (the letters ABS in a circle) and the traction light (a car with wavy lines) should go out after start-up and stay off.", f:[["ABS light on", "A wheel sensor or ABS fault: normal brakes work, but not the anti-lock."],["Traction light on", "The traction control system is off or faulty."]]},
  'drv-cruise': {l:"Cruise control buttons are on the steering wheel or a stalk. Once set, it should hold the speed, and switch off as soon as you touch the brake.", f:[["Won’t set", "Nothing happens when you press set."],["Doesn’t switch off with the brake", "A brake switch fault. Don’t use cruise control until it’s fixed."]]}
};
const TREAD_GUIDE = {l:"New tread is about 8 mm deep. In the grooves there are small raised bars (wear indicators); when the tread is level with them, the tyre is down to 1.6 mm.", f:[["Worn tread", "The gauge reads under 3 mm, or the tread is level with the wear bars."],["Uneven wear", "One edge much lower than the other."],["Stone or nail in the tread", "Remove small stones; leave nails in and get the tyre repaired."]]};
for (const k of ['tyr-fl','tyr-fr','tyr-rl','tyr-rr']) GUIDE[k] = TREAD_GUIDE;

function profileOf(v){

function whereList(v){
  const pr = profileOf(v); const out = (pr ? pr.where : []).map(x => x.slice());
  if (!pr && v.fuel) out.push(['Fuel', v.fuel.toUpperCase() + ' only.']);
  const put = (k, t) => { const i = out.findIndex(x => x[0].toLowerCase() === k.toLowerCase()); if (i >= 0) out[i] = [out[i][0], t]; else out.push([k, t]); };
  if (v.tyres){ const i = out.findIndex(x => x[0] === 'Tyre pressures'); put('Tyre pressures', v.tyres + (i >= 0 ? '. ' + out[i][1] : '')); }
  String(v.where || '').split('\n').map(s => s.trim()).filter(has).forEach(line => { const m = line.match(/^([^:]{2,40}):\s*(.+)$/); if (m) put(m[1].trim(), m[2].trim()); else put('Note', line); });
  put('Papers', "The licence disc is on the windscreen. The registration papers and insurance documents are kept in the legal office: for a trip outside South Africa, collect them first.");
  return out;
}

function guidedSteps(type, v){
  const pr = profileOf(v); const na = new Set((pr && pr.na) || []); const ix = IX();
