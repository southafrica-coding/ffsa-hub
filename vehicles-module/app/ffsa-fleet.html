  if (type !== 'pre' && type !== 'workshop' && attentionFor(v).length) steps.push({k:'attn'});
  const seen = new Set();
  ROUTE.forEach((st, si) => {
    const ids = st.items.filter(id => ix[id] && inType(ix[id], type));
    ids.forEach(i => seen.add(i));
    const show = ids.filter(id => !na.has(id));
    const photos = st.photos && type !== 'pre';
    if (photos && show.length) steps.push({k:'photos', st:si});
    show.forEach((id, j) => steps.push({k:'item', id, st:si, first:j === 0 && !photos}));
  });
  itemsFor(type).filter(id => !seen.has(id)).forEach((id, j) => steps.push({k:'item', id, st:-1, first:j === 0}));

}

function startBtn(v, type, label){

function todayTasks(){
  const today = todayISO(), t1 = addDaysISO(today, 1), t2 = addDaysISO(today, 2), weekAgo = addDaysISO(today, -7);
  const tasks = [], later = []; const ws = wsEvents();
  const vs = S.vehicles.filter(inUse);
  for (const v of vs){
    for (const t of tripsOf(v.id)){
      if (t.from === today) tasks.push({o:0, sev:'warn', v, title:'Pre-trip check', sub:`Leaves today: ${tripName(t)}, back ${fmtDay(t.to)}`, mins:avgMins('pre'), btn:startBtn(v, 'pre')});
      else if (t.from === t1 || t.from === t2) later.push({v, d:t.from, text:`Leaves ${t.from === t1 ? 'tomorrow' : fmtDay(t.from)} (${tripName(t)}, back ${fmtDay(t.to)}): pre-trip check before it goes`});
      if (t.to <= today && t.to >= weekAgo && !(v.lastPost && v.lastPost.date >= t.to)) tasks.push({o:1, sev:'warn', v, title:'Post-trip check', sub:`Back from ${tripName(t)} on ${fmtDay(t.to)}: check for damage, km and fuel`, mins:avgMins('post'), btn:startBtn(v, 'post')});
    }
    for (const w of ws.filter(x => x.vehicleId === v.id)){
      if (w.from === today && v.status !== 'In workshop') tasks.push({o:2, sev:'warn', v, title:`Take it to ${w.provider || 'the workshop'}`, sub:kindShort(w.kind) + (w.to !== w.from ? `, back ${fmtDay(w.to)}` : ''), mins:0, btn:S.canWrite ? `<button class="btn small" data-act="ws-dropoff" data-vid="${esc(v.id)}">Dropped off</button>` : ''});
      else if (w.from === t1 || w.from === t2) later.push({v, d:w.from, text:`${kindShort(w.kind)} at ${w.provider || 'the workshop'} ${w.from === t1 ? 'tomorrow' : fmtDay(w.from)}`});
    }
    if (v.status === 'In workshop'){
      const w = ws.filter(x => x.vehicleId === v.id && x.from <= today).pop();
      tasks.push({o:3, sev:'info', v, title:'At the workshop', sub:(w ? `${kindShort(w.kind)} at ${w.provider || 'the workshop'}${w.to >= today ? ', ready ' + fmtDay(w.to) : ''}. ` : '') + 'When you collect it, check the work and record what was done.', mins:0, btn:S.canWrite && w && w.rec ? `<button class="btn small" data-act="ws-collect" data-rid="${esc(w.rec.id)}">Collected</button>` : ''});
    }
    const wk = weekly(v);
    if (['today','due','overdue'].includes(wk.st)) tasks.push({o:wk.st === 'overdue' ? 4 : 5, sev:wk.st === 'overdue' ? 'crit' : 'warn', v, title:wk.name, sub:wk.st === 'today' ? 'Due today' : wk.label, mins:avgMins(wk.type), btn:startBtn(v, wk.type)});
    for (const d of [t1, t2]){ const w2 = weekly(v, weekStartOf(d)); if (w2.date === d && w2.st === 'planned') later.push({v, d, text:`${w2.name} ${d === t1 ? 'tomorrow' : fmtDay(d)}`}); }
    for (const a of kmAlerts(v).filter(a => a.sev !== 'info')){ const g = suggestGap(v.id); tasks.push({o:6, sev:a.sev, v, title:'Book the workshop', sub:a.text.replace(/: book it at the workshop$/, '') + (g ? `. First free 48 hours: ${fmtRange(g.from, g.to)}` : ''), mins:2, btn:bookGapBtn(v, dueKind(kmPlan(v)), g, 'Book')}); }
  }

  tasks.sort((a, b) => a.o - b.o || SEV_RANK[a.sev] - SEV_RANK[b.sev]);
  later.sort((a, b) => a.d.localeCompare(b.d));
  return {tasks, later};
}

const CHAT_KEY = 'ffsa-chat';

const normQ = s => String(s || '').toLowerCase().replace(/[\s#\-_.]/g, '');
function findVehicle(q){
  const n = normQ(q); if (!n) throw new Error('Say which vehicle.');
  const vs = S.vehicles;
  const exact = vs.filter(v => normQ(v.id) === n || normQ(v.reg) === n || normQ(v.name) === n);
  if (exact.length === 1) return exact[0];
  const hits = vs.filter(v => [v.name, v.reg, v.make, v.model, v.id].some(x => x && (normQ(x).includes(n) || (n.length >= 3 && n.includes(normQ(x)) && normQ(x).length >= 3))));
  if (hits.length === 1) return hits[0];
  if (!hits.length) throw new Error(`No vehicle matches “${q}”. The vehicles are: ${vs.map(v => v.name + (v.reg ? ' (' + v.reg + ')' : '')).join(', ')}.`);
  throw new Error(`“${q}” could be ${hits.map(v => v.name + (v.reg ? ' (' + v.reg + ')' : '')).join(' or ')}. Ask which one.`);
}

function fmtChat(text){
  const lines = esc(text).split('\n'); let html = '', inList = false;
  for (const l of lines){
    const m = l.match(/^\s*[-*•]\s+(.*)$/);
    if (m){ if (!inList){ html += '<ul>'; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if (inList){ html += '</ul>'; inList = false; }
    html += l ? `<p>${l}</p>` : '';
  }
  if (inList) html += '</ul>';
  return html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

    const dd = {pageSize:'A4', pageMargins:[40, 40, 40, 44], defaultStyle:{fontSize:10, lineHeight:1.2}, styles:PDF_STYLES, info:{title:'FFSA Fleet guide'}, footer:(cur, total) => ({margin:[40, 12, 40, 0], fontSize:7.5, color:'#666', columns:[{text:'FFSA Fleet · Guide'}, {text:`Page ${cur} of ${total}`, alignment:'right', width:60}]}), content};
    const b = await pdfBlob(dd);
    await S.downloads.save({filename:`FFSA Fleet guide - ${todayISO()}.pdf`, data:b});
    toast('Saved.');
  } catch(err){ const code = err && err.code; if (code !== 'declined') toast(code === 'rate_limited' ? 'Another download is waiting for your answer. Try again in a moment.' : 'The download didn’t work. Try again.', 'err'); }
  finally { btn.disabled = false; btn.textContent = label; }
}

/* ---------- Boot & data ---------- */
async function boot(){
  S.route = parseHash();
  renderNav();
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ S.status = 'nodb'; render(); return; }
  const [db, assets, user] = await Promise.all([
    c.use('db').catch(() => null), c.use('assets').catch(() => null), c.use('user').catch(() => null)
  ]);
  S.db = db; S.assets = assets; S.user = user;
  try { S.guided = localStorage.getItem('ffsa-guided') !== 'list'; } catch(e){}
  c.use('downloads').then(d => { S.downloads = d; if (S.route.view === 'vehicle' && S.tab === 'manual') render(); }).catch(() => {});
  initAsk(c);
  if (!db){ S.status = 'nodb'; render(); return; }
  if (user){
    try { S.uid = await user.id(); } catch(e){}
    try { const w = await user.can('data.write'); if (w === false) S.canWrite = false; } catch(e){}
  }
  subscribeCore();
  onRoute();
}
function subscribeCore(){
  let confirmed = false;
  const timer = setTimeout(() => { if (!confirmed){ S.loadNote = S.status === 'ready' ? 'The fleet data may be out of date: the server hasn’t answered yet. This page keeps trying.' : 'The fleet data can’t be reached yet. Check your connection; this page keeps trying.'; if (S.status === 'loading') S.status = 'ready'; render(); } }, 10000);
  S.db.collection('fleet').onSnapshot(snap => {
    S.vehicles = snap.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a,b) => (a.sort ?? 99) - (b.sort ?? 99) || (a.name||'').localeCompare(b.name||''));
    S.vmap = Object.fromEntries(S.vehicles.map(v => [v.id, v]));
    if (!snap.metadata.fromCache){ confirmed = true; clearTimeout(timer); S.loadNote = ''; }
    S.status = 'ready';
    softRender();
  }, err => { clearTimeout(timer); S.status = 'error'; S.error = err; render(); });
  S.db.collection('providers').onSnapshot(snap => {
    S.providers = snap.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a,b) => (a.name||'').localeCompare(b.name||''));
    softRender();
  }, () => {});
  S.db.doc('config/checklist').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    if (d && Array.isArray(d.sections) && d.sections.length){ S.checklist = normChecklist(d); S.checklistSaved = true; }
    else { S.checklist = DEFAULT_CHECKLIST; S.checklistSaved = false; }
    softRender();
  }, () => {});
  S.db.doc('config/schedule').onSnapshot(snap => { S.sched = snap.exists ? snap.data() : null; softRender(); }, () => {});
  S.db.collection('trips').onSnapshot(snap => { S.trips = snap.docs.map(d => Object.assign({id:d.id}, d.data())); softRender(); }, () => {});
  S.db.doc('config/notify').onSnapshot(snap => { S.notify = snap.exists ? snap.data() : null; softRender(); }, () => {});
  S.db.collection('records').where('status','==','booked').onSnapshot(snap => { S.bookings = snap.docs.map(d => Object.assign({id:d.id}, d.data())); softRender(); }, () => {});
  S.db.collection('timelog').where('date','>=', addDaysISO(weekStartOf(todayISO()), -56)).onSnapshot(snap => { S.timelog = snap.docs.map(d => Object.assign({id:d.id}, d.data())); S.timeLoaded = true; softRender(); }, () => { S.timeLoaded = false; softRender(); });
}
function ensureVehicleSubs(vid){
  if (!S.db || S.vdata.id === vid) return;
  S.vdata.unsub.forEach(f => { try { f(); } catch(e){} });
  const vd = S.vdata = {id:vid, insp:[], recs:[], odo:[], unsub:[], loaded:{insp:false, recs:false}};
  vd.unsub.push(S.db.collection('odometer').where('vehicleId','==',vid).orderBy('date','desc').limit(100).onSnapshot(s => {
    vd.odo = s.docs.map(d => Object.assign({id:d.id}, d.data())); softRender();
  }, () => {}));
  vd.unsub.push(S.db.collection('inspections').where('vehicleId','==',vid).orderBy('date','desc').limit(150).onSnapshot(s => {
    vd.insp = s.docs.map(d => Object.assign({id:d.id}, d.data())).sort(byDateDesc); vd.loaded.insp = true; softRender();
  }, () => { vd.loaded.insp = true; softRender(); }));
  vd.unsub.push(S.db.collection('records').where('vehicleId','==',vid).orderBy('date','desc').limit(300).onSnapshot(s => {
    vd.recs = s.docs.map(d => Object.assign({id:d.id}, d.data())).sort(byDateDesc); vd.loaded.recs = true; softRender();
  }, () => { vd.loaded.recs = true; softRender(); }));
}

/* ---------- Routing & rendering ---------- */
function parseHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('inspect-')) return {view:'inspect', id:h.slice(8)};
  if (h.startsWith('v-')) return {view:'vehicle', id:h.slice(2)};
  if (h.startsWith('i-')) return {view:'insp', id:h.slice(2)};
  if (h === 'workshops') return {view:'providers'};
  if (h === 'schedule') return {view:'schedule'};
  if (h === 'checklist') return {view:'checklist'};
  if (h === 'calendar') return {view:'calendar'};
  if (h === 'ask') return {view:'ask'};
  if (h.startsWith('guide')){ const p = h.slice(6); return {view:'guide', page:p || null}; }
  if (h === '' || h === 'today') return {view:'today'};
  return {view:'fleet'};
}
function go(h){ if (location.hash === '#' + h){ S.route = parseHash(); onRoute(); } else location.hash = h; }
window.addEventListener('hashchange', () => { S.route = parseHash(); onRoute(); });
function onRoute(){
  const r = S.route;
  if (r.view === 'vehicle' && S.tabFor !== r.id){ S.tab = 'overview'; S.condFilter = 'all'; S.tabFor = r.id; }
  if (r.view === 'inspect'){
    if (!S.draft || S.draft.vehicleId !== r.id) S.draft = loadDraft(r.id) || newDraft(r.id, S.pendingType);
    S.pendingType = null;
    S.draft.tick = Date.now();
  }
  if (r.view === 'guide' && r.page) S.guidePage = r.page;
  if (r.view !== 'checklist') S.clEdit = null;
  S.schedDirty = false;
  S.formRendered = false;
  render();
  window.scrollTo(0, 0);
}
function renderNav(){
  const v = S.route.view;
  const cur = ['providers','checklist','schedule','calendar','today','guide','ask'].includes(v) ? v : 'fleet';
  $$('.mainnav a').forEach(a => { if (a.dataset.nav === cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
}
function softRender(){
  if (S.route.view === 'inspect'){ if (!S.formRendered) render(); return; }
  if (S.route.view === 'checklist' && S.clEdit) return;
  if (S.route.view === 'schedule' && S.schedDirty) return;
  if (S.route.view === 'ask' && $('#chat-log')) return;
  render();
}
function render(){
  if (S.route.view === 'ask' && CHAT.sheet){ CHAT.sheet = false; document.body.classList.remove('sheet-open'); askRoot().innerHTML = ''; }
  renderNav();
  const app = $('#app');
  let html = '';
  if (S.status === 'loading') html = `<div class="state"><h1>Loading the fleet…</h1><p>Fetching vehicles and inspections.</p></div>`;
  else if (S.status === 'nodb') html = `<div class="state"><h1>Sign in to open the fleet log</h1><p>The vehicle records are stored with this page on claude.ai. Open it from claude.ai while signed in and they load here.</p></div>`;
  else if (S.status === 'error') html = `<div class="state"><h1>The fleet data didn’t load</h1><p>${esc(S.error && S.error.code === 'revoked' ? 'This page is no longer available to you.' : 'Reload the page to try again.')}</p></div>`;
  else {
    const r = S.route;
    if (r.view === 'vehicle') html = vehicleView(r.id);
    else if (r.view === 'insp') html = inspDetailView(r.id);
    else if (r.view === 'inspect') html = inspectFormView(r.id);
    else if (r.view === 'providers') html = providersView();
    else if (r.view === 'checklist') html = checklistView();
    else if (r.view === 'schedule') html = scheduleView();
    else if (r.view === 'today') html = todayView();
    else if (r.view === 'calendar') html = calendarView();
    else if (r.view === 'guide') html = guideView();
    else if (r.view === 'ask') html = askView();
    else html = fleetView();
    if (!S.canWrite) html = `<p class="banner">You can view this log. To record inspections, ask the owner to share it with you as an Editor.</p>` + html;
    if (S.loadNote) html = `<p class="banner warn">${esc(S.loadNote)}</p>` + html;
  }
  app.innerHTML = html;
  document.body.classList.toggle('has-savebar', !!app.querySelector('.savebar'));
  placeFab();
  renderFab();
  if (S.route.view === 'ask') renderChatLog();
  if (S.route.view === 'inspect' && S.draft && S.vmap[S.route.id]){ S.formRendered = true; updateProgress(); }
  if (S.status === 'ready' && (S.route.view === 'fleet' || S.route.view === 'vehicle')) markStaleCards();
  resolveNames();
}
async function resolveNames(){
  const els = $$('[data-uid]'); if (!els.length || !S.user) return;
  const ids = [...new Set(els.map(e => e.dataset.uid))];
  try {
    const ps = await S.user.profiles(ids);
    els.forEach(e => { const n = ps[e.dataset.uid] && ps[e.dataset.uid].name; if (n){ (e.querySelector('.who') || e).textContent = n; e.hidden = false; } });
  } catch(e){}

const plate = reg => reg ? `<span class="plate">${esc(reg)}</span>` : `<span class="plate empty">Registration not captured</span>`;
const mono = v => `<span class="vmono">${esc(v.model || v.name || '?')}</span>`;
function thumbs(ids, cap, removable){
  if (!ids || !ids.length) return '';
  return `<div class="thumbs">${ids.map(id => `<span class="thumb"><img src="${blob(id)}" alt="${esc(cap)}" loading="lazy" data-act="lightbox" data-src="${blob(id)}" data-cap="${esc(cap)}">${removable ? `<button type="button" class="rm" data-act="rm-photo" data-target="${esc(removable)}" data-pid="${esc(id)}" aria-label="Remove photo">×</button>` : ''}</span>`).join('')}</div>`;

function condBar(v){
  const c = condCounts(v); const t = c.total || 1;
  const seg = k => c[k] ? `<span class="${k}" style="width:${(c[k]/t*100).toFixed(2)}%"></span>` : '';
  const parts = [];
  if (c.ok) parts.push(`<b>${c.ok}</b> OK`);
  if (c.mon) parts.push(`<b>${c.mon}</b> monitor`);

  parts.push(`<b>${c.unchecked}</b> of ${c.total} not checked yet`);
  return `<div class="cbar" aria-hidden="true">${seg('fix')}${seg('mon')}${seg('ok')}${seg('na')}</div><p class="clegend">${parts.join(' · ')}</p>`;
}

  let any = false;
  for (const sec of S.checklist.sections){
    const rows = sec.items.filter(it => { const s = cond[it.id] && cond[it.id].s; if (f === 'issues') return s === 'fix' || s === 'mon'; if (f === 'unchecked') return !s; if (f === 'ok') return s === 'ok'; return true; });

function photosTab(v){

    results[id] = {s:r.s || null, v:has(r.v) ? String(r.v) : '', n:r.n || '', p:r.p || [], t:ix[id] ? ix[id].t : id, sec:ix[id] ? ix[id].secName : ''};
    if (r.s) counts[r.s]++;
  }
  if (!Object.values(results).some(r => r.s)){ toast('Mark at least one point before saving.', 'err'); return; }
  if (has(v.odometer) && odo < Number(v.odometer)){
    const ok = await confirmBox(`The reading of ${fmtKm(odo)} is lower than the last recorded ${fmtKm(v.odometer)}. Save it anyway?`, 'Save anyway');
    if (!ok) return;
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  tickDraft(); const mins = Math.max(1, Math.round((d.activeMs || 0) / 60000));
  const id = uid('i');
  const doc = {vehicleId:vid, type:d.type, date:d.date, odometer:odo, fuel:d.fuel || '', inspector:(d.inspector || '').trim(), provider:d.type === 'workshop' ? (d.provider || '') : '', trip:d.type === 'post' ? (d.trip || '').trim() : '', docs:d.type === 'workshop' ? (d.docs || []) : [], results, walk:d.walk || {}, extra:d.extra || [], summary:(d.summary || '').trim(), counts, mins, startedAt:d.startedAt || '', createdAt:nowISO(), createdBy:S.uid || null};
  try {
    await S.db.doc('inspections/' + id).set(doc);
    const patch = {updatedAt:nowISO()}; const cond = {};
    for (const [iid, r] of Object.entries(results)){
      if (!r.s) continue;
      const prev = v.condition && v.condition[iid];
      if (!prev || (prev.d || '') <= d.date) cond[iid] = {s:r.s, d:d.date, v:r.v, n:r.n, p:r.p.slice(0, 6), i:id, t:r.t};
    }
    if (Object.keys(cond).length) patch.condition = cond;
    Object.assign(patch, odoPatch(v, odo, d.date));
    if (!v.lastInspection || (v.lastInspection.date || '') <= d.date) patch.lastInspection = {id, date:d.date, type:d.type, counts};
    if (ROUTINE.includes(d.type) && (!v.lastCheck || (v.lastCheck.date || '') <= d.date)) patch.lastCheck = {id, date:d.date, type:d.type};
    if (d.type === 'monthly' && (!v.lastMonthly || (v.lastMonthly.date || '') <= d.date)) patch.lastMonthly = {id, date:d.date};
    if (d.type === 'post') patch.lastPost = {id, date:d.date};
    if (d.type === 'post' && v.status === 'On a trip'){ patch.status = 'In service'; patch.statusSince = d.date; }
    await S.db.doc('fleet/' + vid).update(patch);
    logTime('inspection', vid, mins, {type:d.type, ref:id});
    try { if (doc.inspector) localStorage.setItem('ffsa-inspector', doc.inspector); } catch(e){}
    clearDraft(vid); S.draft = null;
    S.inspCache[id] = Object.assign({id}, doc);
    toast('Inspection saved.');
    go('i-' + id);
  } catch(err){
    btn.disabled = false; btn.textContent = 'Save inspection';
    toast(writeErr(err), 'err');
  }
}
function writeErr(err){
  const c = err && err.code;
  if (c === 'invalid_argument') return 'This change was refused. If you were given view-only access, ask the owner for Editor access.';
  if (c === 'quota_exceeded') return 'Storage for this page is full. Delete old records before adding more.';
  if (c === 'resource_exhausted') return 'Too many changes at once. Wait a few seconds and try again.';
  return 'The change didn’t save. Check your connection and try again.';
}

/* ---------- Uploads ---------- */
async function shrink(file, max=1600, q=0.82){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.type === 'image/jpeg' && file.size < 1.5e6){ bmp.close && bmp.close(); return file; }
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
}
async function uploadOne(f){
  let b = f;
  if (/^image\/(jpeg|png|webp|heic|heif)$/.test(f.type)) b = await shrink(f).catch(() => f);
  const opts = b.type ? undefined : {type:/\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/jpeg'};
  const r = await S.assets.upload(b, opts);
  return {id:r.id, name:f.name || 'photo.jpg', type:r.contentType};
}
function uploadErr(err){
  const c = err && err.code;
  if (c === 'too_large') return 'That file is over 20 MB.';
  if (c === 'unsupported_type') return 'That file type can’t be stored. Use a JPEG or PNG photo, or a PDF.';
  if (c === 'quota_or_state') return 'File storage for this page is full.';
  if (c === 'rate_limited') return 'Too many uploads at once. Wait a moment and try again.';
  if (c === 'not_granted' || c === 'capability_disabled') return 'Uploads need Editor access to this page.';
  return 'The upload didn’t go through. Try again.';
}
async function handleUpload(target, files){
  if (!files.length) return;
  if (!S.assets){ toast('Uploads need Editor access to this page.', 'err'); return; }
  const i = target.indexOf(':'); const kind = i < 0 ? target : target.slice(0, i); const key = i < 0 ? '' : target.slice(i + 1);
  const box = kind === 'docs' ? $('[data-docs]') : kind === 'item' ? $(`[data-thumbs="item:${CSS.escape(key)}"]`) : kind === 'extra' ? $('[data-thumbs="extra"]') : kind === 'walk' ? $(`.slot[data-slot="${key}"] .ph`) : kind === 'rec' ? $('#r-files') : null;
  let ph = null;
  if (box){ ph = document.createElement('span'); ph.className = 'thumb uploading'; ph.textContent = 'Uploading…'; if (kind === 'walk'){ box.textContent = 'Uploading…'; } else box.appendChild(ph); }
  for (const f of (kind === 'walk' || kind === 'vphoto') ? files.slice(0, 1) : files){
    try {
      const r = await uploadOne(f);
      if (kind === 'item'){ const res = S.draft.results[key] || (S.draft.results[key] = {}); res.p = (res.p || []).concat(r.id); }
      else if (kind === 'extra') S.draft.extra = (S.draft.extra || []).concat(r.id);
      else if (kind === 'docs') S.draft.docs = (S.draft.docs || []).concat({id:r.id, name:r.name, type:r.type});
      else if (kind === 'walk') S.draft.walk[key] = r.id;
      else if (kind === 'rec' && S.modal) S.modal.files.push({id:r.id, name:r.name, type:r.type});
      else if (kind === 'vphoto'){ await S.db.doc('fleet/' + key).update({photo:r.id, updatedAt:nowISO()}); toast('Photo saved.'); }
    } catch(err){ toast(err && err.code ? uploadErr(err) : writeErr(err), 'err'); }
  }
  if (ph) ph.remove();
  refreshUploadTarget(kind, key);
  if (S.draft && kind !== 'rec' && kind !== 'vphoto') saveDraft();
}
function refreshUploadTarget(kind, key){
  const ix = IX();
  if (kind === 'item'){ const box = $(`[data-thumbs="item:${CSS.escape(key)}"]`); if (box) box.innerHTML = thumbs((S.draft.results[key] || {}).p, ix[key] ? ix[key].t : '', 'item:' + key); updateItemUI(key); }
  else if (kind === 'extra'){ const box = $('[data-thumbs="extra"]'); if (box) box.innerHTML = thumbs(S.draft.extra, 'Extra photo', 'extra'); }
  else if (kind === 'docs'){ const box = $('[data-docs]'); if (box) box.innerHTML = docsHTML(S.draft.docs, true); }
  else if (kind === 'walk'){ const el = $(`.slot[data-slot="${key}"]`); if (el) el.outerHTML = slotHTML(key, !!S.assets); }
  else if (kind === 'rec' && S.modal){ const box = $('#r-files'); if (box) box.innerHTML = recFilesHTML(); }
}

    const vid = S.modal.vid; const v = S.vmap[vid];
    if (!(await confirmBox(`Remove ${v.name} from the fleet? Its inspection history stays stored but won’t be listed. To keep it visible, set the status to “For sale” instead.`, 'Remove vehicle', true))) return;
    try { await S.db.doc('fleet/' + vid).delete(); closeModal(); toast('Vehicle removed.'); go('fleet'); } catch(err){ toast(writeErr(err), 'err'); }
  },
  'clear-followup': async el => { try { await S.db.doc('fleet/' + el.dataset.vid).update({followUp:null, updatedAt:nowISO()}); toast('Follow-up marked done.'); } catch(err){ toast(writeErr(err), 'err'); } },
  'start-insp': el => {
    const vid = el.dataset.vid; const tc = typeCounts();
    openModal({title:'Start an inspection', narrow:true, body:`<div class="typechoice">${TYPES.map(t => `<button data-act="pick-type" data-type="${t.id}" data-vid="${esc(vid)}"><b>${t.label}</b><span>${tc[t.id]} points. ${t.desc}.</span></button>`).join('')}</div>`});
  },
  'pick-type': async el => {
    const vid = el.dataset.vid, type = el.dataset.type;
    closeModal();
    if (loadDraft(vid) && !(await confirmBox('There is an unsaved draft inspection for this vehicle on this device. Start over and discard it?', 'Discard draft', true))) return;
    S.draft = newDraft(vid, type); saveDraft(); go('inspect-' + vid);
  },
  'set-status': el => {
    const id = el.closest('.item').dataset.item; const r = S.draft.results[id] || (S.draft.results[id] = {});
    r.s = r.s === el.dataset.s ? null : el.dataset.s;
    if (r.s === 'fix' || r.s === 'mon') setMoreOpen(id, true);
    updateItemUI(id); updateProgress(); saveDraft();
    if (el.closest('#gcard') && (r.s === 'ok' || r.s === 'na')){ const at = S.draft.gstep || 0; setTimeout(() => { if (S.draft && (S.draft.gstep || 0) === at && $('#gcard')) gotoStep(at + 1); }, 280); }
    if (el.closest('#gcard') && (r.s === 'fix' || r.s === 'mon')){ const ta = $('textarea[data-note]', itemEl(id)); if (ta) ta.focus(); }
  },
  'toggle-more': el => { const id = el.closest('.item').dataset.item; const open = el.getAttribute('aria-expanded') !== 'true'; setMoreOpen(id, open); if (open){ const ta = $('textarea', itemEl(id)); if (ta) ta.focus(); } saveDraftSoon(); },
  'sec-all-ok': el => {
    const sec = S.checklist.sections.find(s => s.id === el.dataset.sec); if (!sec) return;
    for (const it of sec.items){ if (!inType(it, S.draft.type) || it.m) continue; const r = S.draft.results[it.id] || (S.draft.results[it.id] = {}); if (!r.s){ r.s = 'ok'; updateItemUI(it.id); } }
    updateProgress(); saveDraft();
  },
  'save-insp': el => saveInspection(el),
  'discard-draft': async () => {
    if (!(await confirmBox('Discard this draft inspection? Uploaded photos in it will be lost.', 'Discard', true))) return;
    const vid = S.draft.vehicleId; clearDraft(vid); S.draft = null; go('v-' + vid);
  },
  'rm-photo': async el => {
    const t = el.dataset.target, pid = el.dataset.pid;
    const i = t.indexOf(':'); const kind = i < 0 ? t : t.slice(0, i); const key = i < 0 ? '' : t.slice(i + 1);
    if (kind === 'item'){ const r = S.draft.results[key]; if (r) r.p = (r.p || []).filter(x => x !== pid); }
    else if (kind === 'extra') S.draft.extra = (S.draft.extra || []).filter(x => x !== pid);
    else if (kind === 'walk') delete S.draft.walk[key];
    refreshUploadTarget(kind, key); saveDraft();
    if (S.assets) S.assets.delete(pid).catch(() => {});
  },
  'copy-issues': el => { const v = S.vmap[el.dataset.vid]; if (v) copyModal('Issue list for the workshop', issuesText(v)); },
  'copy-report': el => { const id = el.dataset.iid; const ins = S.vdata.insp.find(x => x.id === id) || S.inspCache[id]; if (ins) copyModal('Inspection report', reportText(ins)); },
  'copy-ta': async () => { const ta = $('#copy-ta'); try { await navigator.clipboard.writeText(ta.value); toast('Copied.'); } catch(e){ ta.focus(); ta.select(); toast('Press Ctrl+C (or long-press and Copy) to copy the selected text.'); } },
  'delete-insp': async el => {
    const id = el.dataset.iid; const ins = S.vdata.insp.find(x => x.id === id) || S.inspCache[id]; if (!ins) return;
    if (!(await confirmBox('Delete this inspection? The vehicle’s condition will be recalculated from the remaining inspections.', 'Delete inspection', true))) return;
    try { await S.db.doc('inspections/' + id).delete(); delete S.inspCache[id]; await recomputeVehicle(ins.vehicleId); toast('Inspection deleted.'); go('v-' + ins.vehicleId); }
    catch(err){ toast(writeErr(err), 'err'); }
  },
  'add-record': el => recordModal(el.dataset.vid, null, 'done'),
  'book-workshop': el => recordModal(el.dataset.vid, null, 'booked'),
  'record-outcome': el => { const rec = S.vdata.recs.find(x => x.id === el.dataset.rid); if (rec) recordModal(rec.vehicleId, rec, 'done'); },
  'wl-add': () => { $('#r-work').insertAdjacentHTML('beforeend', workLineHTML({})); const ins = $$('#r-work .wl-d'); ins[ins.length - 1].focus(); },
  'wl-rm': el => { el.closest('.wl').remove(); },
  'rm-doc': el => { S.draft.docs.splice(Number(el.dataset.i), 1); refreshUploadTarget('docs', ''); saveDraft(); },
  'sched-save': el => saveSchedule(el),
  'add-trip': el => tripModal(el.dataset.vid || null, null),
  'edit-trip': el => { const t = S.trips.find(x => x.id === el.dataset.tid); if (t) tripModal(t.vehicleId, t); },
  'save-trip': el => saveTrip(el),
  'delete-trip': async () => { const t = S.modal && S.modal.trip; if (!t) return; if (!(await confirmBox('Delete this trip?', 'Delete', true))) return; try { await S.db.doc('trips/' + t.id).delete(); closeModal(); toast('Trip deleted.'); } catch(err){ toast(writeErr(err), 'err'); } },
  'notify-save': el => saveNotify(el),
  'edit-record': el => { const rec = S.vdata.recs.find(x => x.id === el.dataset.rid); if (rec) recordModal(rec.vehicleId, rec); },
  'save-record': el => saveRecord(el),
  'delete-record': async () => {
    const rec = S.modal.rec; if (!rec) return;
    if (!(await confirmBox('Delete this workshop visit?', 'Delete', true))) return;
    try { await S.db.doc('records/' + rec.id).delete(); const v = S.vmap[rec.vehicleId]; if (v && v.followUp && v.followUp.recId === rec.id) await S.db.doc('fleet/' + rec.vehicleId).update({followUp:null}); closeModal(); toast('Workshop visit deleted.'); }
    catch(err){ toast(writeErr(err), 'err'); }
  },
  'rm-recfile': el => { S.modal.files.splice(Number(el.dataset.i), 1); $('#r-files').innerHTML = recFilesHTML(); },
  'add-provider': () => providerModal(null),
  'edit-provider': el => providerModal(el.dataset.pid),
  'save-provider': el => saveProvider(el),
  'delete-provider': async () => {
    if (!(await confirmBox('Delete this provider? Past workshop visits keep the name.', 'Delete', true))) return;
    try { await S.db.doc('providers/' + S.modal.pid).delete(); closeModal(); toast('Provider deleted.'); } catch(err){ toast(writeErr(err), 'err'); }
  },
  'toggle-help': el => {
    const box = el.closest('.item, .cl-item'); const id = box && box.dataset.item; const panel = box && $('.item-help', box); if (!panel) return;
    const open = el.getAttribute('aria-expanded') !== 'true';
    if (open && !panel.innerHTML.trim()) panel.innerHTML = helpHTML(id, ctxVehicle());
    panel.hidden = !open; el.setAttribute('aria-expanded', String(open)); el.textContent = open ? 'Hide why and how' : 'Why and how';
  },
  'gnext': () => gotoStep((S.draft.gstep || 0) + 1),
  'gprev': () => gotoStep(Math.max(0, (S.draft.gstep || 0) - 1)),
  'gmode': el => { S.guided = el.dataset.m === 'guided'; try { localStorage.setItem('ffsa-guided', S.guided ? 'guided' : 'list'); } catch(e){} S.formRendered = false; render(); window.scrollTo(0, 0); },
  'add-watch': el => watchModal(el.dataset.vid),
  'edit-watch': el => watchModal(el.dataset.vid, el.dataset.i),
  'save-watch': el => saveWatch(el),
  'del-watch': async el => {
    const v = S.vmap[el.dataset.vid]; if (!v) return;
    if (!(await confirmBox('Remove this note? It will no longer show up at inspections.', 'Remove', true))) return;
    const list = (v.watch || []).slice(); list.splice(+el.dataset.i, 1);
    try { await S.db.doc('fleet/' + v.id).update({watch:list, updatedAt:nowISO()}); toast('Removed.'); } catch(err){ toast(writeErr(err), 'err'); }
  },
  'pdf-card': el => downloadPdf(el, 'card'),
  'pdf-manual': el => downloadPdf(el, 'manual'),
  'cl-filter': el => { S.clFilter = el.dataset.f || ''; render(); },
  'cl-edit': () => { S.clMode = 'edit'; S.clEdit = normChecklist(S.checklist); render(); },
  'cl-sort': () => { S.clMode = 'sort'; S.clEdit = normChecklist(S.checklist); render(); window.scrollTo(0, 0); },
  'sort-set': el => {
    const li = el.closest('.sort-item'); const it = findItem(S.clEdit, li.dataset.item); if (!it) return;
    setRoutine(it, el.dataset.f);
    $$('.sbtn', li).forEach(b => { const on = b.dataset.f === el.dataset.f; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    $('#sort-counts').innerHTML = sortCountsText(sortCounts(S.clEdit));
  },
  'sort-suggest': () => { for (const s of S.clEdit.sections) for (const it of s.items) if (inType(it, 'monthly')) setRoutine(it, SUGGEST_MONTHLY.has(it.id) ? 'monthly' : 'weekly'); const y = window.scrollY; render(); window.scrollTo(0, y); toast('Suggestions applied. Check them, then save.'); },
  'sort-all-weekly': () => { for (const s of S.clEdit.sections) for (const it of s.items) if (inType(it, 'monthly')) setRoutine(it, 'weekly'); const y = window.scrollY; render(); window.scrollTo(0, y); },
  'cl-cancel': () => { S.clEdit = null; render(); },
  'cl-save': el => saveChecklist(el),
  'cl-reset': async () => { if (await confirmBox('Replace your edits with the standard checklist? Nothing changes until you save.', 'Restore')){ S.clEdit = clone(DEFAULT_CHECKLIST); render(); } },
  'cl-add-item': el => { const sec = S.clEdit.sections[+el.dataset.si]; sec.items.push({id:uid('x'), t:'', in:['weekly'], h:''}); render(); const ins = $$(`[data-cl="t"][data-si="${el.dataset.si}"]`); ins[ins.length - 1].focus(); },
  'cl-del-item': el => { S.clEdit.sections[+el.dataset.si].items.splice(+el.dataset.ii, 1); render(); },
  'cl-add-sec': () => { S.clEdit.sections.push({id:uid('s'), name:'New section', items:[{id:uid('x'), t:'', in:['weekly'], h:''}]}); render(); },
  'cl-del-sec': async el => { if (await confirmBox('Remove this whole section from the checklist?', 'Remove', true)){ S.clEdit.sections.splice(+el.dataset.si, 1); render(); } },
  'sheet-open': () => openSheet(),
  'sheet-close': () => closeSheet(),
  'chat-send': () => { const inp = $('#chat-in'); if (inp) chatSend(inp.value); },
  'chat-stop': () => { if (CHAT.ctl) CHAT.ctl.abort(); },
  'chat-sugg': el => { if (/^Log a km reading/.test(el.dataset.q)){ const inp = $('#chat-in'); if (inp){ inp.value = 'Log '; inp.focus(); } return; } chatSend(el.dataset.q); },
  'chat-clear': async () => { if (CHAT.busy && CHAT.ctl) CHAT.ctl.abort(); if (CHAT.turns.length && !(await confirmBox('Start a new chat? This one is cleared from this device.', 'New chat'))) return; CHAT.turns = []; saveChat(); renderChatLog(); },
  'chat-mic': () => {
    const d = CHAT.dict; if (!d) return;
    if (d.active()){ d.stop().catch(() => {}); return; }
    d.start().catch(e => { const c = e && e.code; if (c === 'not_granted' || c === 'unavailable'){ CHAT.noMic = true; updateChatBar(); } else if (!['stopped', 'dismissed'].includes(c)) toast('Speaking didn’t start. Try again, or type instead.', 'err'); });
  },
  'km-log': el => kmModal(el.dataset.vid || null),
  'save-km': el => saveKm(el),
  'cal-move': el => { const n = Number(el.dataset.n); S.calStart = n === 0 ? null : addDaysISO(S.calStart || weekStartOf(todayISO()), n); render(); },
  'book-pick': () => {
    openModal({title:'Book a workshop visit', narrow:true, body:`<p class="muted small" style="margin-bottom:10px">Choose the vehicle. The booking form suggests the first free 48 hours.</p><div class="typechoice">${S.vehicles.filter(inUse).map(v => { const g = suggestGap(v.id); return `<button data-act="book-gap" data-vid="${esc(v.id)}" data-kind="${esc(dueKind(kmPlan(v)))}" data-from="${g ? g.from : ''}" data-to="${g ? g.to : ''}"><b>${esc(v.name)}</b><span>${g ? 'First free 48 hours: ' + esc(fmtRange(g.from, g.to)) : 'No free 48 hours soon'}</span></button>`; }).join('')}</div>`});
  },
  'book-gap': el => { const v = S.vmap[el.dataset.vid]; if (!v) return; closeModal(); const from = el.dataset.from || todayISO(); recordModal(v.id, null, 'booked', {kind:el.dataset.kind || B2B_KIND, date:from, until:el.dataset.to || from, provider:lastProvider(v)}); },
  'move-booking': el => { const rec = S.bookings.find(x => x.id === el.dataset.rid); if (rec) recordModal(rec.vehicleId, rec, 'booked', {date:el.dataset.from, until:el.dataset.to}); },
  'use-gap': el => { $('#r-date').value = el.dataset.from; if ($('#r-until')) $('#r-until').value = el.dataset.to; updateBookingHint(); },
  'move-trip': async el => {
    const t = S.trips.find(x => x.id === el.dataset.tid); const to = S.vmap[el.dataset.to]; if (!t || !to) return;
    if (!(await confirmBox(`Move ${tripName(t)} (${fmtRange(t.from, t.to)}) to ${to.name}? Let the person who booked it know about the change of vehicle.`, 'Move it'))) return;
    try { await S.db.doc('trips/' + t.id).update({vehicleId:to.id, movedFrom:t.vehicleId, updatedAt:nowISO()}); logTime('trip', to.id, 2); toast(`Moved to ${to.name}.`); } catch(err){ toast(writeErr(err), 'err'); }
  },
  'ws-dropoff': async el => { try { await S.db.doc('fleet/' + el.dataset.vid).update({status:'In workshop', statusSince:todayISO(), updatedAt:nowISO()}); logTime('workshop', el.dataset.vid, 1); toast('Marked as at the workshop.'); } catch(err){ toast(writeErr(err), 'err'); } },
  'ws-collect': el => { const rec = S.bookings.find(x => x.id === el.dataset.rid); if (rec) recordModal(rec.vehicleId, rec, 'done'); },
  'pdf-guide': el => guidePdf(el),
  'close-modal': () => closeModal(),
  'confirm-yes': () => endConfirm(true),
  'confirm-no': () => endConfirm(false),
  'lightbox': el => openLightbox(el.dataset.src, el.dataset.cap),
  'close-lightbox': () => { $('#lightbox-root').innerHTML = ''; }
};
document.addEventListener('click', e => {
  if (S.route.view === 'inspect' && S.draft) tickDraft();
  const sc = e.target.dataset && e.target.dataset.scrim;
  if (sc === 'modal') return closeModal();
  if (sc === 'confirm') return endConfirm(false);
  if (sc === 'lightbox') return ($('#lightbox-root').innerHTML = '');
  if (sc === 'sheet') return closeSheet();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = H[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target && e.target.id === 'chat-in' && !e.isComposing){ e.preventDefault(); chatSend(e.target.value); return; }
  if (e.key !== 'Escape') return;
  if ($('#lightbox-root').innerHTML) $('#lightbox-root').innerHTML = '';
  else if ($('#confirm-root').innerHTML) endConfirm(false);
  else if ($('#modal-root').innerHTML) closeModal();
  else if (CHAT.sheet) closeSheet();
});
document.addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') e.target.classList.add('broken'); }, true);
document.addEventListener('toggle', e => {
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.dataset.sec || S.route.view !== 'inspect' || !S.draft) return;
  S.draft.open = S.draft.open || {}; S.draft.open[d.dataset.sec] = d.open; saveDraftSoon();
}, true);
document.addEventListener('input', e => {
  const t = e.target; const d = S.draft;
  if (t.dataset.cl && S.clEdit){ const sec = S.clEdit.sections[+t.dataset.si]; if (t.dataset.cl === 'name') sec.name = t.value; else { const it = sec.items[+t.dataset.ii]; it[t.dataset.cl] = t.dataset.cl === 'l' ? Number(t.value) : t.value; } return; }
  if (t.id === 'n-email' || t.id === 'n-name' || t.id === 'n-phone'){ S.schedDirty = true; return; }
  if (!d || S.route.view !== 'inspect') return;
  tickDraft();
  if (t.id === 'f-date') d.date = t.value;
  else if (t.id === 'f-odo') d.odometer = t.value;
  else if (t.id === 'f-insp') d.inspector = t.value;
  else if (t.id === 'f-summary') d.summary = t.value;
  else if (t.id === 'f-trip') d.trip = t.value;
  else if (t.dataset.note){ const r = d.results[t.dataset.note] || (d.results[t.dataset.note] = {}); r.n = t.value; updateItemUI(t.dataset.note); }
  else if (t.dataset.measure){
    const id = t.dataset.measure; const r = d.results[id] || (d.results[id] = {}); r.v = t.value;
    const auto = autoStatus(IX()[id], t.value); if (auto){ r.s = auto; if (auto !== 'ok') setMoreOpen(id, true); }
    updateItemUI(id); updateProgress();
  } else return;
  saveDraftSoon();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[type=file][data-upload]')){ const files = [...t.files]; const target = t.dataset.upload; t.value = ''; handleUpload(target, files); return; }
  if (t.dataset.weeklyonly){ setWeeklyOnly(t.dataset.weeklyonly, t.checked); return; }
  if (t.dataset.sday || t.dataset.sassign || t.id === 's-max' || t.id === 's-budget' || t.id === 'n-slack'){ S.schedDirty = true; return; }
  if (t.dataset.tstep !== undefined){ const done = tutorialDone(); if (t.checked) done[t.dataset.tstep] = true; else delete done[t.dataset.tstep]; try { localStorage.setItem('ffsa-tutorial', JSON.stringify(done)); } catch(e){} t.closest('.tstep').classList.toggle('done', t.checked); return; }
  if (t.id === 'k-veh'){ const v = S.vmap[t.value]; $('#k-last').textContent = v ? kmLastLine(v) : ''; return; }
  if (t.id === 'r-date' || t.id === 'r-until'){ if (t.id === 'r-date' && $('#r-until') && (!$('#r-until').value || $('#r-until').value < t.value)) $('#r-until').value = t.value; updateBookingHint(); return; }
  if (t.id === 'gap-v'){ const v = S.vmap[t.value]; const out = $('#gap-out'); if (!out) return; if (!v){ out.innerHTML = ''; return; } const g = suggestGap(v.id); out.innerHTML = g ? `First free 48 hours: <strong>${esc(fmtRange(g.from, g.to))}</strong> ${bookGapBtn(v, dueKind(kmPlan(v)), g, 'Book it')}` : 'No free 48 hours in the next few months.'; return; }
  if (t.name === 'r-state'){ applyRecordState(); return; }
  if (t.matches('[data-gjump]')){ if (t.value !== '') gotoStep(+t.value); return; }
  if (t.id === 'cl-guide'){ S.clGuide = t.checked; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.clType && S.clEdit){ const it = S.clEdit.sections[+t.dataset.si].items[+t.dataset.ii]; const set = new Set(it.in || []); if (t.checked) set.add(t.dataset.clType); else set.delete(t.dataset.clType); it.in = TYPES.map(x => x.id).filter(x => set.has(x)); return; }
  if (t.id === 'v-status'){ S.db.doc('fleet/' + t.dataset.vid).update({status:t.value, statusSince:todayISO(), updatedAt:nowISO()}).then(() => toast('Status updated.')).catch(err => toast(writeErr(err), 'err')); return; }
  if (t.id === 'r-kind'){ applyRecordState(); return; }
  if (t.id === 'r-prov'){ $('#r-prov-other-wrap').hidden = t.value !== '__other'; return; }
  const d = S.draft; if (!d || S.route.view !== 'inspect') return;
  if (t.name === 'itype'){ d.type = t.value; saveDraft(); const y = window.scrollY; S.formRendered = false; render(); window.scrollTo(0, y); return; }
  if (t.id === 'f-fuel'){ d.fuel = t.value; saveDraft(); }
  if (t.id === 'f-prov'){ d.provider = t.value; saveDraft(); }
});
window.addEventListener('pagehide', saveDraft);

boot();
</script>
</body>
</html>
