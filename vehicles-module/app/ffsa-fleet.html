<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FFSA Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: dark workshop bar on top, one column of operational panels; vehicles as striped cards, status shown as stripe + pill + bar */
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#15212c; --muted:#5a6876; --line:#d5dce3;
  --accent:#1c5d8c; --accent-ink:#ffffff; --accent-soft:#e1ecf5;
  --bar:#15212c; --bar-ink:#e8eef3; --bar-muted:#9fb0bf;
  --good:#1d7a45; --good-bg:#e2f3e8; --warn:#a35f00; --warn-bg:#fcefd6; --crit:#bd2e25; --crit-bg:#fbe2df; --na:#7b8793; --na-bg:#e9edf1; --on-sem:#ffffff;
  --plate-bg:#fbfbf7; --plate-ink:#111;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#161f28; --surface-2:#1b2631; --ink:#e3eaf0; --muted:#98a7b5; --line:#2a3847;
    --accent:#62aee3; --accent-ink:#07131d; --accent-soft:#163049;
    --bar:#080d12; --bar-ink:#e3eaf0; --bar-muted:#8a9aa9;
    --good:#56c486; --good-bg:#12301f; --warn:#f0aa45; --warn-bg:#3a2a0f; --crit:#f26b60; --crit-bg:#3f1714; --na:#8995a1; --na-bg:#222d38; --on-sem:#0a1218;
    --plate-bg:#e8ebe6; --plate-ink:#111;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --surface-2:#1b2631; --ink:#e3eaf0; --muted:#98a7b5; --line:#2a3847;
  --accent:#62aee3; --accent-ink:#07131d; --accent-soft:#163049;
  --bar:#080d12; --bar-ink:#e3eaf0; --bar-muted:#8a9aa9;
  --good:#56c486; --good-bg:#12301f; --warn:#f0aa45; --warn-bg:#3a2a0f; --crit:#f26b60; --crit-bg:#3f1714; --na:#8995a1; --na-bg:#222d38; --on-sem:#0a1218;
  --plate-bg:#e8ebe6; --plate-ink:#111;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%;display:block}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;background:var(--bar);color:var(--bar-ink)}
.tb-inner{max-width:1120px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;white-space:nowrap}
.brand-mark{font:700 15px/1 var(--f-display);letter-spacing:.12em;background:var(--plate-bg);color:var(--plate-ink);border:2px solid #000;border-radius:4px;padding:4px 7px}
.brand-name{font:600 20px/1 var(--f-display);letter-spacing:.02em}
.mainnav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
.mainnav a{color:var(--bar-muted);text-decoration:none;font-weight:600;font-size:14px;padding:8px 10px;border-radius:6px;white-space:nowrap}
.mainnav a:hover{color:var(--bar-ink)}
.mainnav a[aria-current="page"]{color:var(--bar-ink);background:rgba(255,255,255,.1)}
@media (max-width:520px){.brand-name{display:none}.tb-inner{gap:8px}.mainnav a{padding:8px 6px;font-size:13px}}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px 120px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin:26px 0 18px}
.page-head .sub{color:var(--muted);margin-top:6px}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-weight:600;font-size:14px;text-decoration:none}
.back:hover{text-decoration:underline}

/* Buttons */
.btn{font:600 14px/1.1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.danger:hover{border-color:var(--crit)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Panels, pills, plates */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel + .panel{margin-top:14px}
.panel h2{margin-bottom:10px}
.plate{display:inline-block;font:600 15px/1.25 var(--f-display);letter-spacing:.09em;text-transform:uppercase;padding:2px 8px;border:2px solid #111;border-radius:4px;background:var(--plate-bg);color:var(--plate-ink);white-space:nowrap}
.plate.empty{border:1px dashed var(--line);color:var(--muted);background:transparent;letter-spacing:0;text-transform:none;font:500 12px/1.6 var(--f-body)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.4;padding:2px 9px;border-radius:999px;background:var(--na-bg);color:var(--muted);white-space:nowrap}
.pill.ok,.pill.good{background:var(--good-bg);color:var(--good)}
.pill.mon,.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.fix,.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.na{background:var(--na-bg);color:var(--na)}
.pill.none{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.plate.sm{font-size:12px;padding:1px 6px;border-width:1.5px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.panel-head h2{margin:0}
.statepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.wl{display:grid;grid-template-columns:minmax(0,1fr) 110px 170px 40px;gap:8px;margin-bottom:8px}
@media (max-width:600px){.wl{grid-template-columns:1fr 1fr}.wl .wl-d{grid-column:1/-1}}
.worklist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.worklist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.worklist li > span:first-child{flex:1 1 200px}
.fileitem{display:inline-flex;align-items:center;gap:4px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px}
.daycol.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.daycol h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slotcard{display:grid;gap:8px;justify-items:start;padding:10px;border:1px solid var(--line);border-radius:6px;margin-top:8px;background:var(--surface-2)}
.slotcard a{color:var(--ink);text-decoration:none}
.slotcard a:hover{text-decoration:underline}
table.assign{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
table.assign th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.assign td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.assign select{max-width:220px}
label.chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
label.chip input{width:auto;min-height:0;margin:0}
.cltags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.cltypes{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.cltypes label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.cltypes input{width:auto;min-height:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--na)}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.info{background:var(--accent)} .dot.ok{background:var(--good)}
.banner{border-radius:var(--r);padding:10px 14px;margin-top:16px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.empty{color:var(--muted);padding:16px 0}

/* Fleet */
.attn{padding:0}
.attn-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px 6px}
.attn-head h2{margin:0}
.attn ul{list-style:none;margin:0;padding:0 0 6px}
.attn li a{display:grid;grid-template-columns:auto minmax(110px,170px) 1fr;gap:12px;align-items:center;padding:9px 18px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}
.attn li a:hover{background:var(--surface-2)}
.attn .a-veh{font-weight:600}
.attn .more{padding:8px 18px 12px}
.allclear{display:flex;gap:10px;align-items:center;padding:4px 18px 16px;color:var(--muted)}
@media (max-width:560px){.attn li a{grid-template-columns:auto 1fr}.attn .a-text{grid-column:2}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:22px}
@media (max-width:400px){.vgrid{grid-template-columns:1fr}}
.vcard{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px;color:var(--ink);text-decoration:none;transition:border-color .15s}
.vcard:hover{border-color:var(--accent)}
.vcard.sev-crit{border-left-color:var(--crit)} .vcard.sev-warn{border-left-color:var(--warn)} .vcard.sev-ok{border-left-color:var(--good)}
.vthumb{width:96px;height:96px;border-radius:6px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vmono{font:700 22px/1 var(--f-display);color:var(--muted);text-align:center;padding:4px;letter-spacing:.02em}
.vbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.vtitle{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vtitle h3{font-size:1.3rem}
.vmeta{color:var(--muted);font-size:13px}
.vfoot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);margin-top:auto}
.cbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--na-bg)}
.cbar span{display:block;height:100%}
.cbar .ok{background:var(--good)} .cbar .mon{background:var(--warn)} .cbar .fix{background:var(--crit)} .cbar .na{background:var(--na)}
.clegend{font-size:12px;color:var(--muted)}
.clegend b{font-weight:600;color:var(--ink)}

/* Vehicle page */
.vhead{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-top:14px}
@media (max-width:700px){.vhead{grid-template-columns:1fr}}
.vphoto{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.vphoto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.vphoto .vmono{font-size:34px}
.photo-change{position:absolute;right:8px;bottom:8px;background:rgba(10,16,22,.75);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:5px;cursor:pointer}
.vhead-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.vhead-main h1{font-size:2.3rem}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px}
.facts .k{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts .v{font:600 20px/1.2 var(--f-display);letter-spacing:.02em}
.facts select{min-height:34px;padding:4px 8px;width:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:24px 0 16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0}
.alist .grow{flex:1}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 22px;margin:0}
.kv dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kv dd{margin:3px 0 0;font-weight:500;overflow-wrap:anywhere}
.kv dd.none{color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.two .panel + .panel{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.csec{margin-bottom:20px}
.csec h3{margin-bottom:4px}
.clist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.crow{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .pill{justify-self:start;margin-top:1px}
.clabel{font-weight:500}
.cval{margin-left:8px;font-weight:600}
.cnote{color:var(--muted);font-size:14px;margin-top:2px}
.cdate{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
@media (max-width:560px){.crow{grid-template-columns:1fr;gap:4px}.cdate{text-align:left}}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface-2);cursor:zoom-in;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(10,16,22,.8);color:#fff;font-size:14px;line-height:22px;cursor:pointer;padding:0}
.thumb.uploading{display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:default}
img.broken{opacity:0}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline > li{position:relative;padding:0 0 18px 20px}
.timeline > li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline > li.rec::before{border-color:var(--muted);border-radius:3px}
.hcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--ink);text-decoration:none}
a.hcard:hover{border-color:var(--accent)}
.hhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.hhead strong{font:700 1.15rem/1.2 var(--f-display);letter-spacing:.01em}
.hmeta{font-size:13px;color:var(--muted);margin-top:2px}
.hpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hdesc{margin-top:6px;white-space:pre-wrap}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.file{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:4px 8px;text-decoration:none;color:var(--ink);background:var(--surface-2)}
.gal{margin-bottom:22px}
.gal h3{margin-bottom:8px}
.gal h3 a{text-decoration:none;color:inherit}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.galitem{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);padding:0;cursor:zoom-in;text-align:left;color:var(--ink)}
.galitem img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2)}
.galitem span{display:block;font-size:12px;padding:5px 7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Forms */
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:15px/1.35 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea{min-height:76px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px}
.fgrid .wide{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font:700 1.1rem var(--f-display);margin-bottom:8px;padding:0}
.hintline{font-size:12px;font-weight:400;color:var(--muted)}
.typepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:16px}
.typeopt{position:relative;display:block;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;background:var(--surface)}
.typeopt input{position:absolute;opacity:0;pointer-events:none}
.typeopt b{display:block;font:700 1.15rem var(--f-display)}
.typeopt span{font-size:13px;color:var(--muted)}
.typeopt:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.typeopt:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.slot.filled{border-style:solid}
.slot .ph{aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.slot .ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.slot .bar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;font-size:13px;font-weight:600;background:var(--surface)}
.uplabel{color:var(--accent);cursor:pointer;font-weight:600;font-size:13px}
.uplabel input{display:none}
.progress{position:sticky;top:56px;z-index:10;background:var(--bg);padding:10px 0 10px;margin-top:6px}
.prog-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600}
.prog-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;background:var(--accent);width:0;transition:width .2s}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
details.sec > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:8px;flex:none}
details.sec[open] > summary::after{transform:rotate(-135deg)}
.sec-count{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}

 ]],
